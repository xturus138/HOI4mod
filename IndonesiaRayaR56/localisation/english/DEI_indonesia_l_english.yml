l_english:
 # =====================================================================
 # INDONESIA RAYA: ROAD TO MERDEKA — Localisation (English with preserved Indonesian terms)
 # =====================================================================

 #### FOCUS TREE: Shared Trunk - Prolog Revolusi 1936 ####
 dei_focus_root: "Fracture of the Pax Neerlandica"
 dei_focus_root_desc: "The catastrophic shockwaves of the 1929 Great Depression have shattered the export monopolies of the Dutch East Indies. With rubber, sugar, and tin prices plummeting on world markets, colonial estates and harbors slash indigenous wages to starvation levels. What began as peaceful petitions has boiled over into a coordinated archipelagic strike wave, paralyzing the Tanjung Priok docks and Staatsspoorwegen rail corridors."
 dei_focus_pembangkangan: "Military and Popular Defiance"
 dei_focus_pembangkangan_desc: "The legendary mutiny aboard HNLMS De Zeven Provincien in 1933 shattered the myth of indigenous colonial submission. Today, that defiance spreads like wildfire through native KNIL garrisons at Cimahi and Magelang. Soldiers refuse direct orders from Dutch officers to fire upon striking civilians, opening armories to distribute rifles, carbines, and ammunition crates to underground youth networks."
 dei_focus_momentum_kemerdekaan: "Momentum of the 1936 National Revolution"
 dei_focus_momentum_kemerdekaan_desc: "Colonial authority has collapsed across Java and Sumatra in the face of mass civil disobedience and armed barracks mutinies. From clandestine broadcasting stations, revolutionary vanguards proclaim the birth of a sovereign Nusantara. The decisive question now confronts the nation: under whose political leadership and ideological banner shall the revolution march?"

 #### FOCUS TREE: Path A - Republic ####
 dei_focus_a_proklamasi: "Proclamation of Independence"
 dei_focus_a_proklamasi_desc: "On the front porch of Pegangsaan Timur 56 in Jakarta, Sukarno and Mohammad Hatta read the solemn declaration of national sovereignty to the assembled youth and labor commanders. The red-and-white Sang Saka Merah-Putih is raised against the tropical sky, inaugurating a free, independent, and democratic Republic of Indonesia."
 dei_focus_a_tkr: "Form the Tentara Keamanan Rakyat"
 dei_focus_a_tkr_desc: "A revolutionary declaration without armed defense invites immediate imperialist reconquest. By decree of the provisional government, we amalgamate former PETA officers, Heiho veterans, and youthful laskar guerillas into the Tentara Keamanan Rakyat (TKR), laying the professional institutional cornerstone of our national armed forces."
 dei_focus_a_diplomasi: "Seek International Recognition"
 dei_focus_a_diplomasi_desc: "While our soldiers bleed on the barricades, our diplomats must wage relentless diplomatic struggle on the global stage. Under the brilliant statesmanship of Prime Minister Sutan Sjahrir and Vice President Hatta, we send diplomatic envoys to New Delhi, Washington, and Lake Success to compel the newly formed United Nations to recognize Indonesian independence."
 dei_focus_a_agresi_1: "Confront First Dutch Military Aggression"
 dei_focus_a_agresi_1_desc: "Refusing to accept the loss of their colonial jewel, Dutch armed forces violate ceasefires and launch Operatie Product—a massive mechanized assault aimed at capturing our major agricultural plantations, oilfields, and deepwater harbors. Our forces must hold key choke points, blow bridges, and exact a brutal price for every kilometer of advance."
 dei_focus_a_gerilya: "Guerrilla Warfare Doctrine"
 dei_focus_a_gerilya_desc: "Outmatched in conventional armor and air superiority, the Republic shifts to total territorial resistance. Under General Soedirman's strategic doctrine of Perang Semesta, every mountain ridge, rural desa, and jungle trail becomes a deadly ambush zone, sustained by underground civilian supply kitchens and unyielding popular morale."
 dei_focus_a_agresi_2: "Confront Second Dutch Military Aggression"
 dei_focus_a_agresi_2_desc: "In a desperate bid to decapitate the Republic, Dutch paratroopers drop directly onto Yogyakarta airfield, capturing President Sukarno and his inner cabinet. But their triumph is hollow: Emergency Government of the Republic of Indonesia (PDRI) immediately activates in the rugged Sumatran highlands, while General Soedirman directs island-wide guerrilla strikes from his jungle litter."
 dei_focus_a_kmb: "The Round Table Conference (KMB)"
 dei_focus_a_kmb_desc: "Exhausted by years of relentless guerrilla attrition, facing American threats of Marshall Plan aid termination, and utterly bankrupt, the Dutch government capitulates to international arbitration. In the historic Knights' Hall at The Hague, the Round Table Conference (KMB) concludes with the unconditional transfer of archipelagic sovereignty to the Indonesian people."
 dei_focus_a_parlementer: "Consolidate Parliamentary Democracy"
 dei_focus_a_parlementer_desc: "Establishing a multi-party parliamentary system to unite the diverse political factions of the young Republic."
 dei_focus_a_demokrasi_liberal: "Establish Parliamentary Democracy"
 dei_focus_a_demokrasi_liberal_desc: "With the foreign invader finally driven from our shores, the Republic embraces a vibrant multi-party constitutional democracy. Power shifts to a representative parliament where secular nationalists, modern Muslims, and social democrats contest policy through free elections, robust debate, and civil liberty."
 dei_focus_a_irian_barat: "Liberate West Irian"
 dei_focus_a_irian_barat_desc: "The lingering Dutch colonial occupation of West Irian remains an open wound in the side of the Republic. Sukarno launches a relentless political, economic, and military campaign, proclaiming that Indonesian national revolution can never be declared complete so long as a single inch of our sacred soil remains under European colonial flags."
 dei_focus_a_demokrasi_terpimpin: "Towards Demokrasi Terpimpin"
 dei_focus_a_demokrasi_terpimpin_desc: "Weary of chronic parliamentary turnover, party factionalism, and regional secessionist unrest, Sukarno resolves that Western liberal democracy is unsuited to the communal soul of Indonesia. He advocates for Demokrasi Terpimpin—a centralized, deliberative presidential democracy guided by revolutionary national solidarity."

 #### FOCUS TREE: Path B - Colonial / Federalist ####
 dei_focus_b_root: "Quell the Revolutionary Flames"
 dei_focus_b_root_desc: "Viewing radical republicanism as a path to chaos, Lieutenant Governor-General Hubertus van Mook and federalist Indonesian leaders resolve to pacify the archipelago through orderly constitutional development, establishing a modern decentralized commonwealth that protects commerce and regional autonomy."
 dei_focus_b_tekan_gerilyawan: "Suppress Insurgent Guerrillas"
 dei_focus_b_tekan_gerilyawan_desc: "Armed extremist militias and radical youth gangs threaten public safety and archipelagic economic recovery. The federal administration deploys professional KNIL constabulary and intelligence detachments to secure vital transport corridors, dismantle rebel encampments, and restore civilian rule of law."
 dei_focus_b_reformasi_terbatas: "Limited Political Reforms"
 dei_focus_b_reformasi_terbatas_desc: "To win over moderate Indonesian intellectuals and civil servants, the colonial administration enacts progressive constitutional reforms within the Volksraad, transferring key ministerial portfolios to indigenous leaders and establishing transparent civil service meritocracies."
 dei_focus_b_negara_federal: "Establish Federal States"
 dei_focus_b_negara_federal_desc: "Recognizing the immense ethnic, cultural, and geographic diversity of the archipelago, the federal government establishes autonomous states—including Negara Indonesia Timur, Pasundan, and Madura—granting local communities complete self-determination and preventing Central Javanese political hegemony."
 dei_focus_b_uni_belanda: "The Netherlands-Indonesia Union"
 dei_focus_b_uni_belanda_desc: "A formal Union Treaty establishes a permanent constitutional partnership between the Kingdom of the Netherlands and the United States of Indonesia under the shared crown of Queen Wilhelmina, guaranteeing mutual economic development, joint diplomatic representation, and naval security."
 dei_focus_b_ekonomi_terpadu: "Integrated East Indies Economy"
 dei_focus_b_ekonomi_terpadu_desc: "By re-establishing international confidence, protecting private enterprise, and securing favorable trade treaties with European banking syndicates, we channel vast foreign capital into our archipelagic mines, rubber estates, and transport networks, making Indonesia the wealthiest commercial crossroads of Asia."
 dei_focus_b_dominion_status: "Achieve Dominion Status"
 dei_focus_b_dominion_status_desc: "Following the illustrious constitutional model of Canada and Australia, the United States of Indonesia transitions into a fully self-governing Dominion. All internal and external legislative authority rests firmly with our federal parliament, bound to the Netherlands only by fraternal allegiance to the Crown."
 dei_focus_b_persemakmuran: "Join the Dutch Commonwealth"
 dei_focus_b_persemakmuran_desc: "The Netherlands-Indonesian Union evolves into a modern trans-oceanic Commonwealth of sovereign nations. By pooling technological innovation, industrial expertise, and military defense across Europe and Asia, our confederation stands as a towering pillar of stability and democratic prosperity."

 #### FOCUS TREE: Path C - Communist ####
 dei_focus_c_root: "Consolidate the Front Rakyat"
 dei_focus_c_root_desc: "The bankruptcy of bourgeois nationalism and feudal servitude is laid bare before the working masses. Uniting the PKI, militant trade unions, and radical peasant leagues under the revolutionary Front Rakyat, the working class seizes executive power to establish the People's Republic of Indonesia (Republik Rakyat Indonesia)."
 dei_focus_c_land_reform: "Radical Land Reform"
 dei_focus_c_land_reform_desc: "Centuries of feudal bondage and Dutch plantation slavery are ended with the stroke of a pen. Under the banner of 'Land to the Tiller', revolutionary agrarian tribunals expropriate vast rubber estates and absentee landlord holdings, redistributing fertile plots directly to millions of impoverished sharecroppers."
 dei_focus_c_purge_nasionalis: "Purge Bourgeois Factions"
 dei_focus_c_purge_nasionalis_desc: "To protect the socialist revolution from internal betrayal, revolutionary defense tribunals eliminate reactionary feudal aristocrats, colonial compradors, and bourgeois reformists who conspire with Western intelligence agencies to sabotage the people's state."
 dei_focus_c_tentara_rakyat: "Form the Tentara Rakyat"
 dei_focus_c_tentara_rakyat_desc: "Imperialist armies serve the oppressor classes; our army must be the sword of the proletariat. We forge the Tentara Rakyat Indonesia, an army grounded in Marxist-Leninist political education, dual command under military and political commissars, and iron devotion to working-class liberation."
 dei_focus_c_poros_soviet: "Align with the Soviet Union"
 dei_focus_c_poros_soviet_desc: "Secretary-General Musso establishes direct fraternal ties with Moscow. In exchange for strategic rubber, tin, and oil supplies, the Soviet Union dispatches heavy industrial machine tooling, modern armor prototypes, and military advisory delegations to modernize our revolutionary state."
 dei_focus_c_poros_tiongkok: "Align with Revolutionary China"
 dei_focus_c_poros_tiongkok_desc: "Embracing fraternal solidarity with revolutionary Asian socialism, we forge an unbreakable alliance with Communist China. Incorporating Maoist protracted people's war doctrines and rural mass mobilization, our revolutionary apparatus becomes invincible to imperialist amphibious invasion."
 dei_focus_c_industrialisasi: "Socialist Industrialization"
 dei_focus_c_industrialisasi_desc: "A socialist nation must manufacture its own steel, chemicals, and armaments. We nationalize all heavy industry and enact aggressive state industrialization plans, erecting blast furnaces, power stations, and state tractor factories in the urban corridors of Java."
 dei_focus_c_ekspor_revolusi: "Export the Revolution to Southeast Asia"
 dei_focus_c_ekspor_revolusi_desc: "The liberation of Indonesia is merely the opening salvo of the Asian socialist revolution. We establish training camps and weapon pipelines to arm fraternal communist insurgencies across Malaya, Indochina, the Philippines, and the British Borneo colonies, igniting the red dawn of Southeast Asia."

 #### FOCUS TREE: Path D - Authoritarian Militaristic ####
 dei_focus_d_root: "Military Council Takeover"
 dei_focus_d_root_desc: "Disgusted by parliamentary corruption, party factionalism, and civilian hesitation in the face of national crisis, the General Staff of the Armed Forces stages a swift, bloodless coup. Under the leadership of General Soedirman, the Supreme Revolutionary Military Council takes executive command to impose martial order and forge an invincible nation."
 dei_focus_d_darurat_militer: "Proclaim Martial Law"
 dei_focus_d_darurat_militer_desc: "To purify the nation of subversive agitation and restore absolute civic obedience, the Military Council proclaims an island-wide State of Siege (Staat van Beleg). Civil tribunals are replaced by military courts, curfews are enforced across all major urban centers, and treason is met with instant execution."
 dei_focus_d_bubarkan_partai: "Dissolve Political Parties"
 dei_focus_d_bubarkan_partai_desc: "Divisive political parties are the cancer of the republic, squandering national strength for partisan gain. All political parties and sectarian unions are dissolved by military decree, replaced by a single regimented corporatist front: the National Solidarity Movement (Gerakan Solidaritas Nasional)."
 dei_focus_d_industri_militer: "Mobilize the War Economy"
 dei_focus_d_industri_militer_desc: "A nation that cannot forge its own rifles, artillery, and munitions is destined to be a vassal. We subordinate all private foundries, shipyards, and chemical plants to the Armed Forces Materiel Directorate, establishing state armories capable of continuous mass rearmament."
 dei_focus_d_propaganda: "Radical Nationalist Indoctrination"
 dei_focus_d_propaganda_desc: "Every school, radio transmitter, and newspaper is placed under the direct censorship of the Armed Forces Psychological Warfare Directorate, instilling Spartan discipline, militant patriotism, and unquestioned obedience to the Supreme Command in the minds of the entire populace."
 dei_focus_d_pemuda_militan: "Form the Barisan Pemuda Militan"
 dei_focus_d_pemuda_militan_desc: "The youth of Indonesia are the blood and sinew of the warrior state. We organize millions of teenage boys and girls into regimented youth defense battalions—the Barisan Pemuda Militan—training them in rifle marksmanship, physical endurance, and ideological zeal."
 dei_focus_d_klaim_wilayah: "Enforce Nusantara Raya Claims"
 dei_focus_d_klaim_wilayah_desc: "The colonial boundaries drawn by British and Dutch imperialists across the Malay world are historical insults to archipelagic destiny. We declare the Greater Nusantara doctrine, proclaiming our sovereign rights over Malaya, Northern Borneo, Timor, and Papua."
 dei_focus_d_ambisi_regional: "Regional Power Projection"
 dei_focus_d_ambisi_regional_desc: "To command respect across the Indian and Pacific Oceans, Indonesia must possess an overwhelming naval and air strike capability. We commence the construction of long-range heavy cruiser flotillas, naval air stations, and heavy bomber squadrons to project decisive military dominance across Southeast Asia."

 #### FOCUS TREE: Path E - Islamist (Negara Islam Indonesia) ####
 dei_focus_e_root: "Proclaim the Negara Islam Indonesia"
 dei_focus_e_root_desc: "Rejecting both secular compromises with the infidel colonialist and godless Marxist materialism, Sekarmadji Maridjan Kartosoewirjo proclaims the Negara Islam Indonesia (NII) in the West Java highlands. Under the divine banner of the Quran and the Sunnah, the Islamic state rises to unite all believers."
 dei_focus_e_dewan_ulama: "Establish the Dewan Ulama"
 dei_focus_e_dewan_ulama_desc: "Human legislation is subordinate to divine revelation. We establish the supreme Majelis Syuro and Dewan Ulama, assembling the most venerable Islamic scholars, jurists, and clerics from across the archipelago to oversee state policy, ensure moral righteousness, and guide the national executive."
 dei_focus_e_syariat: "Codify Sharia Law"
 dei_focus_e_syariat_desc: "The colonial legal codes imposed by Dutch imperialists are abolished. We enshrine the sacred Sharia (*Hukum Syariat*) as the supreme, immutable constitution of the land, establishing divine justice, protecting the sanctity of the family, and eradicating moral corruption."
 dei_focus_e_tii: "Consolidate the Tentara Islam Indonesia (TII)"
 dei_focus_e_tii_desc: "We consolidate regional mujahidin battalions, Hizbullah volunteer leagues, and Sabilillah vanguards into the unified Tentara Islam Indonesia (TII). Bound by solemn oaths of martyrdom (*Syahid*) and equipped with captured armaments, our holy warriors are ready to defend the faith against all enemies."
 dei_focus_e_hubungan_arab: "Fraternal Ties with the Arab World"
 dei_focus_e_hubungan_arab_desc: "Reaching out across the Indian Ocean to the sacred centers of Islam, we dispatch diplomatic and theological missions to Cairo, Riyadh, and Damascus. Forging iron bonds of pan-Islamic brotherhood, we secure diplomatic recognition, commercial treaties, and religious support from the wider Arab world."
 dei_focus_e_konflik_sekuler: "Confront Secular and Marxist Elements"
 dei_focus_e_konflik_sekuler_desc: "Secular nationalists and godless Marxists who refuse to submit to divine law threaten the internal unity of the Islamic community (*Ummah*). With unyielding resolve, our religious security police dismantle underground secular cells and purge subversive ideologies from public life."
 dei_focus_e_pendidikan_agama: "Pesantren Educational Reform"
 dei_focus_e_pendidikan_agama_desc: "The historic Pesantren and Madrasah networks of Java, Sumatra, and Aceh become the vibrant intellectual foundation of our state. Revamping curricula to combine classical Islamic sciences with modern engineering, agriculture, and military tactics, we educate a generation of pious and capable citizens."
 dei_focus_e_persatuan_nusantara: "Pan-Islamic Unity of Nusantara"
 dei_focus_e_persatuan_nusantara_desc: "Islam was the historic unifier of the Malay world centuries before European caravels breached our waters. We reach out to Islamic sultanates, ulemas, and communities across Malaya, Patani, Sulu, and Mindanao, forging an archipelagic Islamic commonwealth of faith and mutual defense."

 #### FOCUS TREE: Path F - Majapahit Revival (Ahistorical) ####
 dei_focus_f_root: "Reawaken the Spirit of Majapahit"
 dei_focus_f_root_desc: "Centuries before European colonial flags were stitched, the glorious empire of Majapahit unified Nusantara under the banner of Wilwatikta. Rejecting both Western political models and foreign ideologies, traditional aristocrats, scholars, and customary elders revive the sacred imperial throne to lead Indonesia into a glorious new era."
 dei_focus_f_pusaka: "Expedition for the Sacred Pusaka"
 dei_focus_f_pusaka_desc: "To awaken the ancestral blessings of the land, imperial antiquarians and spiritual scholars mount grand archaeological expeditions across Java, Bali, and Sumatra to recover lost royal regalia (*Pusaka*), ancient Kris daggers, sacred court charters, and the legendary Golden Seal of Raden Wijaya."
 dei_focus_f_dewan_adat: "Form the Dewan Adat Nusantara"
 dei_focus_f_dewan_adat_desc: "We convene the grand Dewan Adat Nusantara, assembling customary kings, Rajas, Datuks, and tribal chiefs from every island. Reviving ancient participatory royal governance, the customary council ensures that regional traditions (*Hukum Adat*) are venerated as sacred imperial law."
 dei_focus_f_angkatan_laut: "Rebuild the Imperial Grand Fleet"
 dei_focus_f_angkatan_laut_desc: "Majapahit was born of the ocean waves and built on uncontested maritime dominance. We commission vast modern dockyards to revive our imperial maritime lineage, constructing modern destroyers, coastal gunboats, and armored cruisers to reassert unchallenged command over our equatorial seas."
 dei_focus_f_klaim_nusantara: "Proclaim Nusantara Raya Claims"
 dei_focus_f_klaim_nusantara_desc: "In accordance with the sacred writings of the Nagarakretagama, the legitimate boundaries of Majapahit encompass the entirety of the Malay archipelago, the Kra Isthmus, and the Philippine seas. We proclaim our hereditary suzerainty over all lands once paying tribute to the throne of Wilwatikta."
 dei_focus_f_persatuan_kerajaan: "Integrate the Royal Principalities"
 dei_focus_f_persatuan_kerajaan_desc: "The historic Sultanates of Java, Sumatra, Banjarmasin, Gowa, and Ternate are formally welcomed into the imperial federation. Preserving their palaces and royal privileges, their traditional regents swear eternal oaths of fealty to the golden throne of the Maharaja."
 dei_focus_f_kekaisaran_baru: "Coronation of the New Empire"
 dei_focus_f_kekaisaran_baru_desc: "Amidst the resonant fanfares of ancestral gamelan and the solemn chanting of court priests, the modern Empire of Nusantara is officially inaugurated. Blending ancient imperial grandeur with modern administrative technology, our reborn empire commands the awe of the world."

 #### DECISIONS: Nusantara & Governance ####
 dei_decisions_category: "Indonesia Raya"
 dei_decisions_category_desc: "Options to accelerate the revolutionary struggle from early 1936."
 dei_decision_revolusi_dini: "Revolusi Dini (Fast-Track Revolution)"
 dei_decision_revolusi_dini_desc: "[OPTIONAL / AHISTORICAL] Unwilling to wait until mid-game? Activate this decision to spark an immediate uprising and jump directly to ideological alignment, bypassing years of colonial preparation."

 dei_decisions_nusantara: "Nusantara Sovereignty & Territorial Diplomacy"
 dei_decisions_nusantara_desc: "Strategic maneuvers and diplomatic campaigns to enforce territorial integrity across the greater archipelago."
 dei_decision_papua_integration: "Demand Sovereignty over West Papua"
 dei_decision_papua_integration_desc: "Asserting that Western New Guinea is an indivisible part of the sovereign nation, repudiating continuing Dutch colonial control."
 dei_decision_timor_integration: "Integrate Portuguese Timor"
 dei_decision_timor_integration_desc: "Pursuing diplomatic annexation or military occupation of the Portuguese colony on eastern Timor to complete island integrity."
 dei_decision_borneo_claims: "Unify the Island of Borneo (Sarawak & Sabah)"
 dei_decision_borneo_claims_desc: "Demanding the complete unification of Borneo and dismantling British colonial holdouts along its northern coastline."
 dei_decision_malaya_claims: "Melayu Raya & Straits of Malacca Claims"
 dei_decision_malaya_claims_desc: "Reviving the pan-archipelagic vision of Greater Malaya, claiming the Malay Peninsula and Singapore."

 dei_decisions_governance: "Archipelagic Governance & National Economy"
 dei_decisions_governance_desc: "Internal development, inter-island resettlement, and monetary sovereignty across the islands."
 dei_decision_transmigrasi: "Inter-Island Transmigrasi Program"
 dei_decision_transmigrasi_desc: "Relocating surplus agricultural labor from densely populated Java to Sumatra and Borneo to expand cultivation and industry."
 dei_decision_terbitkan_ori: "Issue Oeang Republik Indonesia (ORI)"
 dei_decision_terbitkan_ori_desc: "Printing and circulating our own sovereign national currency to break economic dependency on colonial NICA guilders."
 dei_decision_patroli_maritim: "Maritime Security Patrol Operations"
 dei_decision_patroli_maritim_desc: "Deploying naval and coast guard flotillas to suppress piracy and safeguard inter-island shipping lanes."

