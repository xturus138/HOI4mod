 dei_focus_a_gerilya: "Strategi Perang Gerilya"
 dei_focus_a_gerilya_desc: "Saat kalah jumlah dan persenjataan, medan dan rakyat jadi senjata utama."
 dei_focus_a_agresi_2: "Hadapi Agresi Militer Belanda II"
 dei_focus_a_agresi_2_desc: "Gelombang kedua serangan Belanda, kali ini lebih menentukan."
 dei_focus_a_kmb: "Perundingan Meja Bundar"
