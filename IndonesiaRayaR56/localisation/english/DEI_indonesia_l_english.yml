 # ---------------------------------------------------------------------
 # UNIVERSAL OUTER ISLANDS LIBERATION & INDEPENDENCE WAR
 # ---------------------------------------------------------------------
 dei_focus_liberate_sumatra: "Liberation of Sumatra"
 dei_focus_liberate_sumatra_desc: "The vast island of Andalas—rich in rubber estates, Ombilin coal basins, and vital oil refineries—remains under the heavy thumb of isolated Dutch colonial garrisons. By linking clandestine Republican committees with local laskar fighters and defecting native police, we will orchestrate a sweeping island-wide liberation campaign to secure Sumatra for the Republic."
 dei_focus_liberate_sumatra_tt: "Mobilizes revolutionary laskars and bolsters infantry weapons and logistical supply for the Sumatra expedition."

 dei_focus_liberate_borneo: "Liberation of Borneo & Vital Refineries"
 dei_focus_liberate_borneo_desc: "The deep jungles and strategic petroleum complexes of Balikpapan and Tarakan are among the most coveted strategic prizes in the Pacific. We must act decisively, dispatching maritime transport flotillas and mobilizing local Dayak and coastal militias to seize the refineries and airfields before colonial scorched-earth detachments can detonate the storage tanks."
 dei_focus_liberate_borneo_tt: "Provides convoy transports, fuel reserves, and organizes guerrilla combat brigades across Borneo."

 dei_focus_liberate_timur_raya: "Eastern Seas Amphibious Operation"
 dei_focus_liberate_timur_raya_desc: "Spanning from the Makassar Straits and the Minahasa highlands to Bali, Timor, and the Moluccan Spice Islands, the Great East represents our archipelagic naval lifeline. By coordinating indigenous prahu fleets and coastal landing parties, we will sever colonial sea lanes and establish uncontested republican governance across the eastern seas."
 dei_focus_liberate_timur_raya_tt: "Expanding maritime convoy capacity and deploying popular defense garrisons across the eastern islands."

 dei_focus_liberate_papua: "West Papua Integration"
 dei_focus_liberate_papua_desc: "The integrity of Indonesian national sovereignty admits no compromise and no partition: from Sabang at the western tip of Sumatra to Merauke at the eastern border of Papua, Nusantara is an indivisible homeland. We repudiate Dutch attempts to maintain a colonial rump state in New Guinea and integrate West Papua into the sovereign Republic."
 dei_focus_liberate_papua_tt: "Integrates Western New Guinea (Papua Barat) as a legitimate core territory of Indonesia."

 dei_focus_traktat_kedaulatan: "Treaty of Full Sovereignty"
 dei_focus_traktat_kedaulatan_desc: "Through unyielding sacrifice in the field and disciplined solidarity across the islands, the Indonesian revolution has rendered colonial restoration impossible. Facing decisive military setbacks and overwhelming international diplomatic censure, the Kingdom of the Netherlands is compelled to the negotiating table to sign a formal treaty acknowledging our total and unconditional sovereignty."

 dei_trunk.7.t: "War of National Independence"
 dei_trunk.7.d: "With the collapse of Pax Neerlandica across Java and the proclamation of independence echoing throughout the archipelago, the colonial government in The Hague refuses to recognize our sovereignty. The Kingdom of the Netherlands redeploys KNIL garrisons and naval flotillas to reclaim the Dutch East Indies. Across every corner of the homeland, youth militias and people's brigades prepare to take up arms. Freedom or death!"
 dei_trunk.7.a: "Merdeka or Death! To arms!"

 dei_trunk.8.t: "Round Table Conference — Recognition of Sovereignty"
 dei_trunk.8.d: "Confronted by the unbreakable guerrilla resistance of the Indonesian people across the archipelago and mounting international diplomatic pressure, the Kingdom of the Netherlands concedes at the negotiating table, agreeing to a total ceasefire. The Netherlands formally and unconditionally recognizes the full sovereignty of Indonesia over all former territories of the Dutch East Indies."
 dei_trunk.8.a: "Full Sovereignty Recognized!"

 dei_trunk.9.t: "The Netherlands Recognizes Full Indonesian Sovereignty"
 dei_trunk.9.d: "A momentous historic milestone is forged on the world stage. Through a formal peace treaty, the Kingdom of the Netherlands de jure and de facto recognizes the independence and sovereignty of the Republic of Indonesia. Centuries of colonial dominion on the soil of Nusantara have come to an end."
 dei_trunk.9.a: "Indonesia Raya — Free at Last!"
 dei_trunk.9.b: "Dutch colonial rule over the Indies has ended."

 dei_trunk.10.t: "Revolution in Andalas: Arms Smuggling & the People's Militia"
 dei_trunk.10.d: "Under cover of darkness across the Sunda Strait, flotillas of Republic fishing prahus and swift sampans slip through the tight cordon of Dutch naval patrols. Thousands of rifles and ammunition crates land safely upon the shores of Lampung and Bengkulu. Deep in the Bukit Barisan highlands, Minangkabau youth laskars, Batak fighter brigades, and Ombilin coal miners answer the call of revolution with unified cries of Merdeka. KNIL outposts at Palembang and Medan find themselves increasingly isolated and besieged."
 dei_trunk.10.a: "Andalas Rises Against Colonialism!"

 dei_trunk.11.t: "Operation Borneo Jungle: The Oil Front & the Mandau Oath"
 dei_trunk.11.d: "From the northern coast of Java, Republic motorized sailing convoys make landfall at the river mouths of West and South Kalimantan. Amidst the dense rainforests of Borneo, Republic officers forge sacred alliances with Dayak tribal chieftains and refinery labor syndicates. Before colonial troops can carry out scorched-earth demolitions of the vital installations in Balikpapan and Tarakan, guerrilla commandos secure the petroleum reserves to power the engine of the national struggle!"
 dei_trunk.11.a: "Secure the Oil of Nusantara!"

 dei_trunk.12.t: "Wave of the Eastern Seas: Pinisi Expeditions to Sulawesi & Maluku"
 dei_trunk.12.d: "The ancient maritime glory of the ancestors surges anew across the eastern seas. Dozens of Bugis-Makassar Pinisi schooners, crewed by the intrepid mariners of the Spice Islands, brave the treacherous swells of the Makassar Strait and Flores Sea under the shadow of Dutch naval gunboats. Flying the Sang Saka Merah-Putih from their tallest masts, they smuggle vital military logistics into the hands of freedom fighters in Celebes, Bali, Lombok, and Ambon. The eastern ocean blazes with the fire of resistance!"
 dei_trunk.12.a: "Our Ancestors Were Seafarers!"

 dei_trunk.13.t: "Dawn of the Red-and-White in Papua: From Sabang to Merauke"
 dei_trunk.13.d: "From the highland valleys of Baliem to the coastal settlements of Hollandia and Merauke, the call for the unity of one nation and one people breaches the final colonial redoubts. Pioneer freedom fighters and indigenous Papuan communities proclaim that the land of the Bird of Paradise is an inseparable part of the body of the Republic of Indonesia. The solemn pledge of the nation's founders is indelibly etched: national sovereignty spans unbroken, from western Sabang to the eastern horizon of Merauke!"
 dei_trunk.13.a: "From Sabang to Merauke — Unite!"


 # =====================================================================
 # PATH NEWS EVENTS (Jalur A - F)
 # =====================================================================

 # PATH A: Republik Nasionalis-Demokratis
 dei_news_a.1.t: "Proclamation Echoes Across Nusantara"
 dei_news_a.1.d: "Radio Republik Indonesia broadcasts the Proclamation of Independence across the waves. Crowds in cities throughout the archipelago pour into the streets to celebrate."
 dei_news_a.1.a: "Broadcast it to the world!"

 dei_news_a.2.t: "KNIP Session: Foundations of the First Government"
 dei_news_a.2.d: "The Central Indonesian National Committee convenes an emergency assembly in Jakarta, establishing the Republic's first cabinet and constitutional framework."
 dei_news_a.2.a: "The Republic stands!"

 dei_news_a.3.t: "Linggadjati Agreement: Hope and Controversy"
 dei_news_a.3.d: "Indonesian and Dutch plenipotentiaries sign a provisional ceasefire accord. Staunch republican factions passionately denounce any compromise with colonial power."
 dei_news_a.3.a: "The struggle continues."

 dei_news_a.4.t: "Pancasila: The Five Pillars of the Nation"
 dei_news_a.4.d: "Sukarno enshrines the Pancasila as the immutable philosophical foundation of the state, bridging the historic divide between Islamic scholars and secular nationalists."
 dei_news_a.4.a: "Bhinneka Tunggal Ika — Unity in Diversity!"

 # PATH B: Kolonial / Federalis
 dei_news_b.1.t: "Van Mook Arrives in Batavia"
 dei_news_b.1.d: "Lieutenant Governor-General Van Mook arrives in Batavia bearing a new mandate from The Hague to resolve the archipelagic crisis through a federal commonwealth framework."
 dei_news_b.1.a: "The negotiating table opens."

 dei_news_b.2.t: "Volksraad Dissolved, BFO Assembly Convenes"
 dei_news_b.2.d: "Colonial authorities formally dissolve the Volksraad, convening traditional rulers and regional delegates into the Federal Consultative Assembly (BFO)."
 dei_news_b.2.a: "A new era begins."

 dei_news_b.3.t: "Union Treaty: Two Flags Side by Side"
 dei_news_b.3.d: "The Netherlands-Indonesian Union Treaty is formally concluded. The United States of Indonesia emerges nominally sovereign, bound by mutual defense and economic pacts with the Crown."
 dei_news_b.3.a: "The Federation is established."

 dei_news_b.4.t: "European Capital Returns"
 dei_news_b.4.d: "Dutch, British, and American syndicates resume extensive investment in tea, rubber, and petroleum operations under the firm security guarantees of the federal government."
 dei_news_b.4.a: "The gears of commerce turn again."

 # PATH C: Komunis (Front Rakyat)
 dei_news_c.1.t: "Musso Returns: The East Wind from Moscow"
 dei_news_c.1.d: "PKI Secretary-General Musso returns from long exile in Moscow. Massive crowds of workers and revolutionary cadres gather at Surabaya harbor to welcome him with revolutionary fervor."
 dei_news_c.1.a: "The revolution begins!"

 dei_news_c.2.t: "Agrarian Reform: Land to the Peasantry"
 dei_news_c.2.d: "A sweeping radical land reform campaign commences. Feudal estates and colonial concessions are expropriated and transferred directly to landless peasant collectives."
 dei_news_c.2.a: "Land to the tillers!"

 dei_news_c.3.t: "Dockworkers Strike: Tanjung Priok Paralyzed"
 dei_news_c.3.d: "The Red Maritime Labor Federation initiates a coordinated general strike. Maritime commerce grinds to a complete halt, striking a crippling blow to foreign monopoly capital."
 dei_news_c.3.a: "Workers of Nusantara, unite!"

 dei_news_c.4.t: "Revolutionary Youth Congress of Nusantara"
 dei_news_c.4.d: "The first Pan-Archipelagic Revolutionary Youth Congress opens in Central Java. Fraternal delegates from Vietnam, Malaya, and the Philippines pledge internationalist solidarity."
 dei_news_c.4.a: "The Red International!"

 # PATH D: Otoriter Militeristik
 dei_news_d.1.t: "State of Siege: Island-Wide Curfew Across Java"
 dei_news_d.1.d: "The Supreme Revolutionary Command proclaims martial law across Java. Civilian political assemblies are suspended, curfews imposed, and total mobilization decreed to safeguard national defense."
 dei_news_d.1.a: "Order shall prevail!"

 dei_news_d.2.t: "Battle of Ambarawa: General Soedirman Takes Command"
 dei_news_d.2.d: "Fierce combat at the mountain bastion of Ambarawa demonstrates the tactical prowess of the Republican military. General Soedirman directs operations directly from the frontline despite frail health."
 dei_news_d.2.a: "Never surrender!"

 dei_news_d.3.t: "Bung Tomo's Fiery Broadcast: Radio of the Resistance"
 dei_news_d.3.d: "Bung Tomo delivers an electrifying radio address to the defenders of Surabaya. His rallying cry of 'Allahu Akbar! Merdeka atau Mati!' reverberates across every wireless receiver in Java."
 dei_news_d.3.a: "Freedom or death!"

 dei_news_d.4.t: "Republican Wings: Adisoetjipto Takes Flight"
 dei_news_d.4.d: "Commodore Agustinus Adisoetjipto pilots the first combat aircraft bearing Republican insignia across the skies of Yogyakarta, christening the birth of modern Indonesian military aviation."
 dei_news_d.4.a: "The skies belong to us!"

 # PATH E: Islamis (Negara Islam Indonesia)
 dei_news_e.1.t: "Proclamation of the Islamic State of Indonesia"
 dei_news_e.1.d: "Imam S.M. Kartosoewirjo officially proclaims the Islamic State of Indonesia (NII). Regiments of the Tentara Islam Indonesia rapidly establish sovereign administrative control over the West Java highlands."
 dei_news_e.1.a: "Allahu Akbar!"

 dei_news_e.2.t: "Majelis Syuro: Supreme Council of Ulama"
 dei_news_e.2.d: "Venerable Islamic scholars and jurists from every island gather to constitute the Majelis Syuro as the supreme deliberative body of state, codifying Islamic jurisprudence as the supreme law of the land."
 dei_news_e.2.a: "Rule by mutual consultation."

 dei_news_e.3.t: "Mission to the East: Outreach to Sulawesi and Maluku"
 dei_news_e.3.d: "Religious envoys and educators journey east to Sulawesi, Kalimantan, and Maluku, forging staunch alliances with regional Islamic leaders and expanding the territorial sphere of the Islamic State."
 dei_news_e.3.a: "A blessing for all creation."

 dei_news_e.4.t: "Pan-Islamic Recognition: Cairo Welcomes the New Caliphate"
 dei_news_e.4.d: "Diplomats from Cairo and the Arab League extend formal greetings to the Islamic State of Indonesia, opening direct trade missions and cementing pan-Islamic geopolitical ties."
 dei_news_e.4.a: "Islamic brotherhood across borders!"

 # PATH F: Kemaharajaan Majapahit
 dei_news_f.1.t: "Imperial Coronation: Grand Ceremony at Trowulan"
 dei_news_f.1.d: "Tens of thousands of subjects assemble at the historic capital of Majapahit to witness the solemn coronation of the first supreme Emperor in over five centuries amidst resonant gamelan fanfares."
 dei_news_f.1.a: "Glory to Wilwatikta!"

 dei_news_f.2.t: "Restoration of Trowulan: Ancestral Splendor Revived"
 dei_news_f.2.d: "A monumental imperial architectural initiative undertakes the meticulous restoration of ancient Trowulan, rebuilding sacred royal gates, council pavillions, and ceremonial sanctuaries."
 dei_news_f.2.a: "The heritage of our ancestors!"

 dei_news_f.3.t: "Borobudur: Beacon of the Archipelagic Renaissance"
 dei_news_f.3.d: "Extensive conservation and restoration of Candi Borobudur is officially concluded. The Maharaja personally presides over the ceremonial consecration of the great world monument."
 dei_news_f.3.a: "The rebirth of Nusantara!"

 dei_news_f.4.t: "Grand Jung Armada Sets Sail"
 dei_news_f.4.d: "Shipwrights in Makassar and Tuban complete the first squadron of modern heavy ocean-going junks and armed gunboats, sailing forth to assert uncontested naval dominion over the equatorial oceans."
 dei_news_f.4.a: "The seas belong to Nusantara!"

