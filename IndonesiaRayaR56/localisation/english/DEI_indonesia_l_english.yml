 #### EVENTS: batang bersama ####
 dei_trunk.1.t: "Hindia Belanda Menyongsong Zaman Baru"
 dei_trunk.1.d: "Pemerintah kolonial menegaskan kembali otoritasnya atas Nusantara, sembari dunia bersiap menghadapi ketegangan yang meningkat."
 dei_trunk.1.a: "Lanjutkan"

 dei_trunk.2.t: "Sekolah-Sekolah Baru, Pikiran-Pikiran Baru"
 dei_trunk.2.d: "Lulusan sekolah pribumi mulai membaca surat kabar, berdiskusi tentang nasib bangsa mereka. Sebagian pejabat khawatir ini akan berujung pada tuntutan yang lebih besar."
 dei_trunk.2.a: "Biarkan pendidikan berkembang bebas"
 dei_trunk.2.b: "Batasi kurikulum yang dianggap berbahaya"

 dei_trunk.3.t: "Suara-Suara di Volksraad"
 dei_trunk.3.d: "Tokoh-tokoh pergerakan semakin lantang menuntut perubahan. Pemerintah harus memilih: menindak atau berdialog."
 dei_trunk.3.a: "Tindak tegas para tokoh pergerakan"
 dei_trunk.3.b: "Buka ruang dialog dan negosiasi"

 dei_trunk.4.t: "Mencari Kawan di Tengah Ketegangan Dunia"
 dei_trunk.4.d: "Dengan bayang-bayang perang di cakrawala, pemerintah Hindia mempertimbangkan hubungan yang lebih erat dengan kekuatan-kekuatan Barat lainnya."
 dei_trunk.4.a: "Dekati Amerika Serikat dan Inggris"
 dei_trunk.4.b: "Tetap berdiri sendiri"

 dei_trunk.5.t: "Bayang-Bayang dari Utara"
 dei_trunk.5.d: "Kekaisaran Jepang memandang kekayaan minyak dan karet Hindia Belanda dengan penuh minat. Persiapan pertahanan menjadi mendesak."
 dei_trunk.5.a: "Percepat persiapan pertahanan"

 dei_trunk.6.t: "Titik Balik Sejarah"
 dei_trunk.6.d: "Nusantara berada di persimpangan jalan yang menentukan. Arah mana yang akan dipilih untuk masa depan negeri ini?"
 dei_trunk.6.a: "Proklamasikan Republik yang demokratis"
 dei_trunk.6.b: "Pertahankan ikatan dengan Belanda dalam bentuk federasi"
 dei_trunk.6.c: "Bangun negara rakyat yang komunis"
 dei_trunk.6.d: "Serahkan kekuasaan pada kekuatan nasionalis radikal"
 dei_trunk.6.e: "Dirikan negara berlandaskan Islam"
 dei_trunk.6.f: "Bangkitkan kembali kejayaan Majapahit (ahistoris)"

 #### EVENTS: Revolusi Dini ####
 dei_revolusi_dini.1.t: "Pemberontakan Meletus Lebih Awal!"
 dei_revolusi_dini.1.d: "[MODE AHISTORIS] Jauh sebelum sejarah 'seharusnya' mencatatnya, gelombang pemberontakan pecah di berbagai penjuru Hindia. Ini bukan yang terjadi sebenarnya — ini adalah pilihanmu untuk mempercepat jalan cerita."
 dei_revolusi_dini.1.a: "Manfaatkan momentum ini — lanjutkan ke penentuan arah bangsa"

