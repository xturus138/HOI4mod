 #### FOCUS TREE: batang bersama ####
 dei_focus_root: "Hindia Belanda di Persimpangan Jalan"
 dei_focus_root_desc: "Tahun 1936. Krisis ekonomi global masih membekas, sementara suara-suara nasionalisme mulai terdengar di Volksraad. Pemerintah kolonial harus memutuskan arah."
 dei_focus_volksraad: "Perkuat Volksraad"
 dei_focus_volksraad_desc: "Memberi Volksraad (Dewan Rakyat) lebih banyak wewenang nyata, alih-alih sekadar badan penasihat simbolis."
 dei_focus_econ_liberal: "Liberalisasi Ekonomi"
 dei_focus_econ_liberal_desc: "Buka lebih banyak sektor ekonomi Hindia untuk pengusaha pribumi dan investasi asing di luar Belanda."
 dei_focus_econ_conservative: "Pertahankan Monopoli Kolonial"
 dei_focus_econ_conservative_desc: "Pertahankan sistem tanam paksa modern dan monopoli dagang demi keuntungan maksimal bagi Belanda."
 dei_focus_native_education: "Perluasan Pendidikan Pribumi"
 dei_focus_native_education_desc: "Sekolah-sekolah baru untuk penduduk pribumi — sekaligus, tanpa disadari, menyemai bibit-bibit kesadaran nasional."
 dei_focus_nationalist_watch: "Sikapi Gerakan Nasionalis"
 dei_focus_nationalist_watch_desc: "Tokoh-tokoh seperti Mohammad Hoesni Thamrin semakin lantang bersuara di Volksraad. Bagaimana pemerintah harus bersikap?"
 dei_focus_knil_reform: "Reformasi KNIL"
 dei_focus_knil_reform_desc: "Modernisasi Koninklijk Nederlandsch-Indisch Leger (KNIL) menghadapi ketidakpastian kawasan Pasifik."
 dei_focus_defense_plan: "Rencana Pertahanan Hindia"
 dei_focus_defense_plan_desc: "Menyusun rencana pertahanan menyeluruh untuk kepulauan yang sangat luas ini."
 dei_focus_foreign_support: "Cari Dukungan Asing"
 dei_focus_foreign_support_desc: "Mendekati Amerika Serikat dan Inggris untuk dukungan diplomatik dan logistik."
 dei_focus_japan_threat: "Waspada Ancaman Jepang"
 dei_focus_japan_threat_desc: "Ekspansi Jepang di Asia semakin nyata. Hindia Belanda, dengan kekayaan minyaknya, jadi incaran utama."
 dei_focus_momentum_kemerdekaan: "Momentum Kemerdekaan"
 dei_focus_momentum_kemerdekaan_desc: "Sejarah sampai di titik balik. Arah apa yang akan diambil Nusantara dari sini?"

 #### FOCUS TREE: Jalur A - Republik ####
 dei_focus_a_proklamasi: "Proklamasi Kemerdekaan"
 dei_focus_a_proklamasi_desc: "Momen yang ditunggu: menyatakan kemerdekaan penuh dari kekuasaan kolonial."
 dei_focus_a_tkr: "Bentuk Tentara Keamanan Rakyat"
