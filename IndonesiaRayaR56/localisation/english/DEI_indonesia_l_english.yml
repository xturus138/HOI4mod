 #### STRATEGIC MEGA-PROJECTS & REGIONAL BASES ####
 dei_decisions_mega_projects: "Strategic Mega-Projects & Regional Bases"
 dei_decisions_mega_projects_desc: "High-priority national development projects to fortify strategic island perimeters and modernize vital military infrastructure."
 dei_project_ujung_surabaya: "Expand Ujung Naval Arsenal & Drydocks"
 dei_project_ujung_surabaya_desc: "Modernize the maritime complex at Tanjung Perak and Ujung Surabaya, adding drydock repair berths and heavy coastal fortifications."
 dei_project_arsenal_bandung: "Bandung Artillerie Inrichtingen Mega-Arsenal"
 dei_project_arsenal_bandung_desc: "Expand weapons and munitions casting plants at the Bandung military plateau, creating a fortified mountain weapons redoubt."
 dei_project_kilang_minyak: "Modernize Plaju & Balikpapan Oil Refineries"
 dei_project_kilang_minyak_desc: "Upgrade crude distillation units and synthetic fuel cracking facilities in South Sumatra and East Borneo."
 dei_project_grote_postweg: "Modernize De Grote Postweg & Trans-Java Railway"
 dei_project_grote_postweg_desc: "Pave trunk highways and double-track rail lines from Anyer to Panarukan, massively speeding up cross-island army deployments."
 dei_project_benteng_selat: "Straits Coastal Fortification Batteries"
 dei_project_benteng_selat_desc: "Construct heavy coastal artillery batteries and anti-aircraft emplacements guarding the Sunda and Malacca choke points."
 dei_project_lanud_iswahyudi: "Strategic Airbase Network (Iswahyudi & Kalijati)"
 dei_project_lanud_iswahyudi_desc: "Construct hardened aircraft revetments, long runways, and early warning radar stations across Java."

 #### TOTAL PEOPLE'S DEFENSE (SISHANRATA) & WARTIME MECHANICS ####
 dei_decisions_defense: "Total People's Defense & Wartime Logistics"
 dei_decisions_defense_desc: "Mobilization and wartime survival measures under the Sistem Pertahanan Rakyat Semesta doctrine."
 dei_mechanic_sishanrata: "Proclaim the People's Universal Defense System (Sishanrata)"
 dei_mechanic_sishanrata_desc: "When faced with imperialist invasion, mobilize every kampung, village, and youth organization into active guerrilla defense."
 dei_mechanic_pinisi_logistics: "Mobilize the Pinisi Schooner Blockade Runners"
 dei_mechanic_pinisi_logistics_desc: "Deploy thousands of traditional motorized wooden Bugis and Makassar Pinisi schooners to slip through enemy naval blockades."
 dei_mechanic_dapur_umum: "Organize Dapur Umum & Field Medics"
 dei_mechanic_dapur_umum_desc: "Mobilize women's auxiliary leagues and civilian volunteers to maintain continuous field kitchens and medical aid for soldiers."
 dei_mechanic_pabrik_gunung: "Improvised Mountain Guerrilla Workshops"
 dei_mechanic_pabrik_gunung_desc: "Convert civilian metalware, pipes, and agricultural chemicals into improvised firearms, landmines, and hand grenades."

 #### MILITARY MECHANICS & MEGA-PROJECT NATIONAL SPIRITS ####
 dei_idea_trans_java_corridor: "Trans-Java Strategic Corridor"
 dei_idea_trans_java_corridor_desc: "Integrated rail and highway networks allow lightning-fast redeployment of motorized and infantry divisions across Java."
 dei_idea_sishanrata_active: "People's Universal Defense System"
 dei_idea_sishanrata_active_desc: "A doctrine of total defense where every citizen, village, and field contributes to grinding down the invader."
 dei_idea_pinisi_logistics: "Pinisi Blockade Runner Fleet"
 dei_idea_pinisi_logistics_desc: "Shallow-draft wooden schooners navigate coral reefs and narrow straits undetected, maintaining supply lines to isolated garrisons."
 dei_idea_dapur_umum: "Dapur Umum Logistics Solidarity"
 dei_idea_dapur_umum_desc: "Civilian kitchens provide hot rations and medical care directly to the front lines, bolstering troop morale and endurance."

