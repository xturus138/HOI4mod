l_english:
 # =====================================================================
 # INDONESIA RAYA: ROAD TO MERDEKA — Localisation (English with preserved Indonesian terms)
 # =====================================================================

 #### FOCUS TREE: Shared Trunk ####
 dei_focus_root: "The Dutch East Indies at the Crossroads"
 dei_focus_root_desc: "The year is 1936. The Great Depression still casts its long shadow, while nationalist voices grow bolder within the Volksraad. The colonial administration must chart its course."
 dei_focus_volksraad: "Empower the Volksraad"
 dei_focus_volksraad_desc: "Granting the Volksraad (People's Council) genuine legislative authority, rather than serving as a mere symbolic advisory body."
 dei_focus_econ_liberal: "Economic Liberalization"
 dei_focus_econ_liberal_desc: "Opening key sectors of the Indies economy to indigenous entrepreneurs and foreign investment beyond the Netherlands."
 dei_focus_econ_conservative: "Maintain Colonial Monopolies"
 dei_focus_econ_conservative_desc: "Upholding modern plantation concessions and state trade monopolies to ensure maximum revenue flows to the Dutch Crown."
 dei_focus_native_education: "Expand Native Education"
 dei_focus_native_education_desc: "Establishing new public schools for the native population — inadvertently sowing the seeds of modern national consciousness."
 dei_focus_nationalist_watch: "Address the Nationalist Movement"
 dei_focus_nationalist_watch_desc: "Prominent leaders like Mohammad Hoesni Thamrin speak with growing fervor in the Volksraad. How shall the administration respond?"
 dei_focus_knil_reform: "Reform the KNIL"
 dei_focus_knil_reform_desc: "Modernizing the Koninklijk Nederlandsch-Indisch Leger (KNIL) to prepare for gathering storm clouds across the Pacific."
 dei_focus_defense_plan: "Indies Defense Plan"
 dei_focus_defense_plan_desc: "Formulating a comprehensive territorial defense strategy for an immense and fragmented archipelago."
 dei_focus_foreign_support: "Seek Foreign Backing"
 dei_focus_foreign_support_desc: "Approaching the United States and the British Empire for diplomatic recognition, arms shipments, and naval support."
 dei_focus_japan_threat: "Waspada Ancaman Jepang"
 dei_focus_japan_threat_desc: "Japanese expansionism in East Asia accelerates. The East Indies, rich in vital oil and rubber, is their prime southern target."
 dei_focus_momentum_kemerdekaan: "Momentum Kemerdekaan"
 dei_focus_momentum_kemerdekaan_desc: "History reaches its decisive turning point. What path shall the peoples of Nusantara forge from here?"

 #### FOCUS TREE: Path A - Republic ####
 dei_focus_a_proklamasi: "Proklamasi Kemerdekaan"
 dei_focus_a_proklamasi_desc: "The long-awaited moment has arrived: declaring complete sovereignty and independence from colonial rule."
 dei_focus_a_tkr: "Form the Tentara Keamanan Rakyat"
 dei_focus_a_tkr_desc: "A newly proclaimed republic requires its own regular armed forces to defend the soil against returning imperialists."
 dei_focus_a_diplomasi: "Seek International Recognition"
 dei_focus_a_diplomasi_desc: "Appealing to the United Nations and newly independent Asian nations to acknowledge the Republic as a sovereign state."
 dei_focus_a_agresi_1: "Confront Agresi Militer Belanda I"
 dei_focus_a_agresi_1_desc: "Dutch forces launch major military offensives to seize economic centers and restore colonial dominance."
 dei_focus_a_gerilya: "Guerrilla Warfare Doctrine"
 dei_focus_a_gerilya_desc: "Outnumbered and outgunned in open warfare, our mountains, jungles, and steadfast people become our greatest shield."
 dei_focus_a_agresi_2: "Confront Agresi Militer Belanda II"
 dei_focus_a_agresi_2_desc: "The second wave of Dutch assaults falls directly upon our republican capital. The struggle enters its existential phase."
 dei_focus_a_kmb: "Perundingan Meja Bundar (KMB)"
 dei_focus_a_kmb_desc: "Mounting international outrage and fierce local resistance compel the Dutch to the conference table in The Hague."
 dei_focus_a_parlementer: "Consolidate Parliamentary Democracy"
 dei_focus_a_parlementer_desc: "Establishing a multi-party parliamentary system to unite the diverse political factions of the young Republic."
 dei_focus_a_demokrasi_liberal: "Establish Parliamentary Democracy"
 dei_focus_a_demokrasi_liberal_desc: "Instituting a multi-party parliamentary system under a constitutional democracy."
 dei_focus_a_irian_barat: "Liberate West Irian"
 dei_focus_a_irian_barat_desc: "The territorial integrity of the Republic remains incomplete until West Irian is returned to the homeland."
 dei_focus_a_demokrasi_terpimpin: "Towards Demokrasi Terpimpin"
 dei_focus_a_demokrasi_terpimpin_desc: "Chronic cabinet instability and regional revolts push Sukarno to restore the 1945 Constitution and centralize executive authority."

 #### FOCUS TREE: Path B - Colonial / Federalist ####
 dei_focus_b_root: "Quell the Revolutionary Flames"
 dei_focus_b_root_desc: "The colonial administration resolves to maintain Dutch authority across the East Indies at any cost."
 dei_focus_b_tekan_gerilyawan: "Suppress Insurgent Guerrillas"
 dei_focus_b_tekan_gerilyawan_desc: "Deploying KNIL military sweeps and intelligence operations to dismantle armed rebel strongholds."
 dei_focus_b_reformasi_terbatas: "Limited Political Reforms"
 dei_focus_b_reformasi_terbatas_desc: "Granting controlled concessions within the Volksraad framework to pacify moderate nationalist discontent without ceding control."
 dei_focus_b_negara_federal: "Establish Federal States"
 dei_focus_b_negara_federal_desc: "Creating autonomous states such as Negara Indonesia Timur and Pasundan to decentralize power and counter republican hegemony."
 dei_focus_b_uni_belanda: "The Netherlands-Indonesia Union"
 dei_focus_b_uni_belanda_desc: "Forging a constitutional union under the House of Orange-Nassau, linking the metropole and the archipelago."
 dei_focus_b_ekonomi_terpadu: "Integrated East Indies Economy"
 dei_focus_b_ekonomi_terpadu_desc: "Consolidating maritime trade and corporate links between the Netherlands and the colonial administration."
 dei_focus_b_dominion_status: "Achieve Dominion Status"
 dei_focus_b_dominion_status_desc: "Attaining broad internal self-governance modeled after the British Dominions while retaining crown sovereignty."
 dei_focus_b_persemakmuran: "Join the Dutch Commonwealth"
 dei_focus_b_persemakmuran_desc: "Finalizing an enduring commonwealth of equal partner realms spanning Europe, the Caribbean, and Asia."

 #### FOCUS TREE: Path C - Communist ####
 dei_focus_c_root: "Consolidate the Front Rakyat"
 dei_focus_c_root_desc: "The PKI and socialist left unite under the Front Rakyat to spearhead the revolutionary transition."
 dei_focus_c_land_reform: "Radical Land Reform"
 dei_focus_c_land_reform_desc: "Confiscating colonial plantations and feudal estates, redistributing the soil directly to impoverished tenant farmers."
 dei_focus_c_purge_nasionalis: "Purge Bourgeois Factions"
 dei_focus_c_purge_nasionalis_desc: "Neutralizing aristocratic landlords, colonial collaborators, and right-wing elements that threaten the socialist vanguard."
 dei_focus_c_tentara_rakyat: "Form the Tentara Rakyat"
 dei_focus_c_tentara_rakyat_desc: "Forging disciplined revolutionary armed forces rooted in class solidarity and political commissar oversight."
 dei_focus_c_poros_soviet: "Align with the Soviet Union"
 dei_focus_c_poros_soviet_desc: "Securing heavy industrial machinery, technical expertise, and security guarantees from Moscow."
 dei_focus_c_poros_tiongkok: "Align with Revolutionary China"
 dei_focus_c_poros_tiongkok_desc: "Embracing Maoist agrarian doctrine and building a fraternal anti-imperialist front across East Asia."
 dei_focus_c_industrialisasi: "Socialist Industrialization"
 dei_focus_c_industrialisasi_desc: "Nationalizing natural resources and state utilities to construct a self-sufficient industrial economy."
 dei_focus_c_ekspor_revolusi: "Export the Revolution to Southeast Asia"
 dei_focus_c_ekspor_revolusi_desc: "Providing arms and sanctuary to communist insurgents fighting across Southeast Asia."

 #### FOCUS TREE: Path D - Authoritarian Militaristic ####
 dei_focus_d_root: "Military Council Takeover"
 dei_focus_d_root_desc: "Frustrated by political infighting and perceived civilian weakness, senior military officers seize executive control."
 dei_focus_d_darurat_militer: "Proclaim Martial Law"
 dei_focus_d_darurat_militer_desc: "Suspending ordinary constitutional law to impose iron military discipline across all islands."
 dei_focus_d_bubarkan_partai: "Dissolve Political Parties"
 dei_focus_d_bubarkan_partai_desc: "Abolishing factional parties in favor of a single corporatist front dedicated to state authority."
 dei_focus_d_industri_militer: "Mobilize the War Economy"
 dei_focus_d_industri_militer_desc: "Subordinating all private manufacturing, mining, and agriculture to state rearmament priorities."
 dei_focus_d_propaganda: "Radical Nationalist Indoctrination"
 dei_focus_d_propaganda_desc: "Instilling martial virtues, duty, and unquestioning national loyalty into the minds of every citizen."
 dei_focus_d_pemuda_militan: "Form the Barisan Pemuda Militan"
 dei_focus_d_pemuda_militan_desc: "Organizing millions of patriotic youths into regimented auxiliary formations ready for total defense."
 dei_focus_d_klaim_wilayah: "Enforce Nusantara Raya Claims"
 dei_focus_d_klaim_wilayah_desc: "The borders drawn by European colonizers are illegitimate. Nusantara claims its historic sphere of dominance."
 dei_focus_d_ambisi_regional: "Regional Power Projection"
 dei_focus_d_ambisi_regional_desc: "Building a powerful blue-water fleet to dominate the vital maritime straits connecting the Indian and Pacific Oceans."

 #### FOCUS TREE: Path E - Islamist (Negara Islam Indonesia) ####
 dei_focus_e_root: "Proclaim the Negara Islam Indonesia"
 dei_focus_e_root_desc: "Kartosoewirjo's Darul Islam movement declares an Islamic state, repudiating both secular nationalism and colonial compromise."
 dei_focus_e_dewan_ulama: "Establish the Dewan Ulama"
 dei_focus_e_dewan_ulama_desc: "Forming a supreme consultative council of leading Ulama to guide constitutional and executive policy."
 dei_focus_e_syariat: "Codify Sharia Law"
 dei_focus_e_syariat_desc: "Constitutionalizing Islamic jurisprudence as the supreme law of the land."
 dei_focus_e_tii: "Consolidate the Tentara Islam Indonesia (TII)"
 dei_focus_e_tii_desc: "Transforming regional mujahidin militias into a unified, religiously devoted national army."
 dei_focus_e_hubungan_arab: "Fraternal Ties with the Arab World"
 dei_focus_e_hubungan_arab_desc: "Establishing diplomatic and scholarly missions to Egypt, Saudi Arabia, and the emerging post-colonial Islamic world."
 dei_focus_e_konflik_sekuler: "Confront Secular and Marxist Elements"
 dei_focus_e_konflik_sekuler_desc: "Overcoming resistance from secular nationalists and communist factions to solidify Islamic governance."
 dei_focus_e_pendidikan_agama: "Pesantren Educational Reform"
 dei_focus_e_pendidikan_agama_desc: "Placing traditional Islamic boarding schools and madrasas at the center of national literacy and civil training."
 dei_focus_e_persatuan_nusantara: "Pan-Islamic Unity of Nusantara"
 dei_focus_e_persatuan_nusantara_desc: "Uniting Muslim communities and traditional sultanates across the Malay archipelago under a common religious banner."

 #### FOCUS TREE: Path F - Majapahit Revival (Ahistorical) ####
 dei_focus_f_root: "Reawaken the Spirit of Majapahit"
 dei_focus_f_root_desc: "[AHISTORICAL] A revivalist movement invokes the ancient glory of the Majapahit Empire as a unifying imperial banner."
 dei_focus_f_pusaka: "Expedition for the Sacred Pusaka"
 dei_focus_f_pusaka_desc: "Dispatching antiquarians and scholars to unearth ancient royal regalia and rediscover lost state rituals."
 dei_focus_f_dewan_adat: "Form the Dewan Adat Nusantara"
 dei_focus_f_dewan_adat_desc: "Convening customary kings, sultans, and clan elders from every island into a grand imperial consultative assembly."
 dei_focus_f_angkatan_laut: "Rebuild the Imperial Grand Fleet"
 dei_focus_f_angkatan_laut_desc: "Reviving the ancient maritime supremacy that once swept piracy and rival kingdoms from the equatorial seas."
 dei_focus_f_klaim_nusantara: "Proclaim Nusantara Raya Claims"
 dei_focus_f_klaim_nusantara_desc: "Reaffirming the ancient Sumpah Palapa oath: claiming all lands from the Kra Isthmus to the shores of Papua."
 dei_focus_f_persatuan_kerajaan: "Integrate the Royal Principalities"
 dei_focus_f_persatuan_kerajaan_desc: "Uniting the historic kratons and sultanates of Java, Sumatra, Bali, and Sulawesi under imperial suzerainty."
 dei_focus_f_kekaisaran_baru: "Coronation of the New Empire"
 dei_focus_f_kekaisaran_baru_desc: "The culmination of imperial restoration: declare a sovereign empire carrying forward the mantle of Majapahit."

 #### DECISIONS: Nusantara & Governance ####
 dei_decisions_category: "Indonesia Raya"
 dei_decisions_category_desc: "Options to accelerate the revolutionary struggle from early 1936."
 dei_decision_revolusi_dini: "Revolusi Dini (Fast-Track Revolution)"
 dei_decision_revolusi_dini_desc: "[OPTIONAL / AHISTORICAL] Unwilling to wait until mid-game? Activate this decision to spark an immediate uprising and jump directly to ideological alignment, bypassing years of colonial preparation."

 dei_decisions_nusantara: "Kedaulatan & Diplomasi Wilayah Nusantara"
 dei_decisions_nusantara_desc: "Strategic maneuvers and diplomatic campaigns to enforce territorial integrity across the greater archipelago."
 dei_decision_papua_integration: "Demand Sovereignty over West Papua"
 dei_decision_papua_integration_desc: "Asserting that Western New Guinea is an indivisible part of the sovereign nation, repudiating continuing Dutch colonial control."
 dei_decision_timor_integration: "Integrate Portuguese Timor"
 dei_decision_timor_integration_desc: "Pursuing diplomatic annexation or military occupation of the Portuguese colony on eastern Timor to complete island integrity."
 dei_decision_borneo_claims: "Unify the Island of Borneo (Sarawak & Sabah)"
 dei_decision_borneo_claims_desc: "Demanding the complete unification of Borneo and dismantling British colonial holdouts along its northern coastline."
 dei_decision_malaya_claims: "Melayu Raya & Straits of Malacca Claims"
 dei_decision_malaya_claims_desc: "Reviving the pan-archipelagic vision of Greater Malaya, claiming the Malay Peninsula and Singapore."

 dei_decisions_governance: "Tata Kelola Kepulauan & Ekonomi Nasional"
 dei_decisions_governance_desc: "Internal development, inter-island resettlement, and monetary sovereignty across the islands."
 dei_decision_transmigrasi: "Inter-Island Transmigrasi Program"
 dei_decision_transmigrasi_desc: "Relocating surplus agricultural labor from densely populated Java to Sumatra and Borneo to expand cultivation and industry."
 dei_decision_terbitkan_ori: "Issue Oeang Republik Indonesia (ORI)"
 dei_decision_terbitkan_ori_desc: "Printing and circulating our own sovereign national currency to break economic dependency on colonial NICA guilders."
 dei_decision_patroli_maritim: "Maritime Security Patrol Operations"
 dei_decision_patroli_maritim_desc: "Deploying naval and coast guard flotillas to suppress piracy and safeguard inter-island shipping lanes."

 #### NATIONAL SPIRITS / IDEAS ####
 dei_idea_volksraad_reformed: "Reformed Volksraad"
 dei_idea_liberalized_economy: "Liberalized Economy"
 dei_idea_colonial_monopoly: "Colonial Monopoly"
 dei_idea_native_sentiment_high: "Rising Native Sentiment"
 dei_idea_home_defense_plan: "Archipelago Defense Plan"
 dei_idea_revolusi_dini_spirit: "Zeal of the Revolusi Dini"
 dei_idea_republik_diproklamasikan: "Republic Proclaimed"
 dei_idea_guerrilla_doctrine: "Doctrine of Perang Gerilya"
 dei_idea_liberal_democracy_established: "Parliamentary Democracy"
 dei_idea_guided_democracy: "Demokrasi Terpimpin"
 dei_idea_persemakmuran_belanda: "Member of the Dutch Commonwealth"
 dei_idea_republik_rakyat_indonesia: "People's Republic Established"
 dei_idea_tentara_rakyat_disiplin: "Disciplined Red People's Army"
 dei_idea_rezim_militer_konsolidasi: "Consolidated Military Junta"
 dei_idea_industri_militer_kuat: "Mobilized War Industry"
 dei_idea_negara_islam_konsolidasi: "Negara Islam Consolidated"
 dei_idea_tii_terbentuk: "Tentara Islam Indonesia Formed"
 dei_idea_dewan_adat_terbentuk: "Dewan Adat Established"
 dei_idea_kekaisaran_nusantara: "Reborn Empire of Nusantara"

 #### EVENTS: Shared Trunk ####
 dei_trunk.1.t: "The Dutch East Indies Enters a New Era"
 dei_trunk.1.d: "The colonial administration reasserts its authority over the immense archipelago, as mounting international rivalries cast a shadow over Asia."
 dei_trunk.1.a: "Proceed"

 dei_trunk.2.t: "New Schools, New Ideas"
 dei_trunk.2.d: "Graduates of vernacular and colonial schools read newspapers and debate the future of their people. Conservative officials warn that broad education nurtures dangerous nationalist sentiment."
 dei_trunk.2.a: "Allow native education to expand freely"
 dei_trunk.2.b: "Restrict curricula deemed subversive"

 dei_trunk.3.t: "Voices in the Volksraad"
 dei_trunk.3.d: "Nationalist delegates speak with increasing defiance, demanding meaningful home rule. The administration must decide: accommodate reformist demands or tighten control."
 dei_trunk.3.a: "Repress radical agitators"
 dei_trunk.3.b: "Open room for dialogue and reform"

 dei_trunk.4.t: "Reforming the KNIL"
 dei_trunk.4.d: "The Koninklijk Nederlandsch-Indisch Leger requires extensive modernization and expanded native recruitment if it is to defend these far-flung islands."
 dei_trunk.4.a: "Modernize equipment and expand local recruitment"
 dei_trunk.4.b: "Rely primarily on traditional European officer corps"

 dei_trunk.5.t: "The Rising Sun in the South"
 dei_trunk.5.d: "Imperial Japan's advance into China and French Indochina signals an imminent threat to the oil fields of Sumatra and Borneo. The Indies must stand ready."
 dei_trunk.5.a: "Prepare total archipelago defense"

 dei_trunk.6.t: "Momentum Kemerdekaan: A Crossroads of History"
 dei_trunk.6.d: "The old colonial equilibrium has shattered. In the crucible of global war and rising national awakening, the destiny of Nusantara hangs in the balance. What path will we forge?"
 dei_trunk.6.a: "Path A: Democratic-Nationalist Republic (Sukarno)"
 dei_trunk.6.b: "Path B: Colonial / Federalist Commonwealth (Van Mook)"
 dei_trunk.6.c: "Path C: Communist People's Vanguard (Musso)"
 dei_trunk.6.d: "Path D: Authoritarian Military Regime (Soedirman)"
 dei_trunk.6.e: "Path E: Islamic State of Indonesia (Kartosoewirjo)"
 dei_trunk.6.f: "Path F: Imperial Resurgence of Majapahit (Wuryaningrat)"

 #### EVENTS: Revolusi Dini ####
 dei_revolusi_dini.1.t: "Gelora Revolusi Dini"
 dei_revolusi_dini.1.d: "[OPTIONAL / AHISTORICAL] Rejecting the slow pace of colonial reform, patriotic factions take up arms years ahead of schedule. The colonial administration collapses into nationwide revolt."
 dei_revolusi_dini.1.a: "Advance immediately to ideological alignment"

 #### EVENTS: Path A - Republic ####
 dei_path_a.1.t: "Proklamasi Kemerdekaan"
 dei_path_a.1.d: "The text of the proclamation has been finalized. How shall we announce our sovereignty to a turbulent world?"
 dei_path_a.1.a: "Proclaim immediately, accept all risks"
 dei_path_a.1.b: "Secure diplomatic and military arrangements first"

 dei_path_a.2.t: "Forming the Tentara Keamanan Rakyat"
 dei_path_a.2.d: "The fledgling Republic desperately needs an organized armed force to defend independence against imperialist forces."
 dei_path_a.2.a: "Build from veteran PETA and KNIL cadres"
 dei_path_a.2.b: "Mobilize broad volunteer people's militias"

 dei_path_a.3.t: "Seeking World Recognition"
 dei_path_a.3.d: "Diplomatic envoys are dispatched abroad to convince foreign powers of the Republic's sovereign legitimacy."
 dei_path_a.3.a: "Approach India and newly independent Asian states"
 dei_path_a.3.b: "Rally international press sympathy"

 dei_path_a.4.t: "Agresi Militer Belanda I"
 dei_path_a.4.d: "Dutch forces initiate large-scale military operations across Java and Sumatra to reconquer key economic sectors."
 dei_path_a.4.a: "Fight directly on the frontlines"
 dei_path_a.4.b: "Conduct an orderly retreat to conserve strength"

 dei_path_a.5.t: "Agresi Militer Belanda II"
 dei_path_a.5.d: "A second massive Dutch assault falls upon the republican capital of Yogyakarta. National survival hangs by a thread."
 dei_path_a.5.a: "Fight to the last breath"
 dei_path_a.5.b: "Open emergency diplomatic appeals through the UN"

 dei_path_a.6.t: "Perundingan Meja Bundar (KMB)"
 dei_path_a.6.d: "Under immense international pressure, the Netherlands agrees to substantive negotiations on full sovereignty transfer."
 dei_path_a.6.a: "Ratify the treaty — full sovereignty recognized"

 dei_path_a.7.t: "The Tumult of Parliamentary Democracy"
 dei_path_a.7.d: "Political parties flourish across the nation, but fragile coalition governments form and collapse in rapid succession."
 dei_path_a.7.a: "Form a broad, stable national coalition"
 dei_path_a.7.b: "Permit minority governance to move decisively"

 dei_path_a.8.t: "The West Papua Dispute"
 dei_path_a.8.d: "The Dutch retain hold of Western New Guinea, defying republican sovereignty. The public demands a resolution."
 dei_path_a.8.a: "Pursue military confrontation and infiltration"
 dei_path_a.8.b: "Pursue diplomatic arbitration at the UN"

 dei_path_a.9.t: "Towards Demokrasi Terpimpin"
 dei_path_a.9.d: "Endless political factionalism and regional revolts spur the consolidation of executive power under the national leader."
 dei_path_a.9.a: "Accept this new constitutional direction"

 #### EVENTS: Path B - Colonial / Federalist ####
 dei_path_b.1.t: "Quelling the Flames of Revolution"
 dei_path_b.1.d: "The colonial administration deliberates how best to suppress the revolutionary uprising."
 dei_path_b.1.a: "Total crackdown without mercy"
 dei_path_b.1.b: "Measured police actions to avoid international backlash"

 dei_path_b.2.t: "Counter-Insurgency Operations"
 dei_path_b.2.d: "Security forces launch coordinated sweep operations to root out guerilla encampments in the hills."
 dei_path_b.2.a: "Focus on securing economic centers and ports"
 dei_path_b.2.b: "Deep-jungle offensive campaigns"

 dei_path_b.3.t: "Establishing Federal States in Java"
 dei_path_b.3.d: "Creating semi-autonomous states like Pasundan to balance local aristocratic elites against radical republicanism."
 dei_path_b.3.a: "Grant substantial local autonomy"
 dei_path_b.3.b: "Retain strong central executive oversight"

 dei_path_b.4.t: "Consolidating Negara Indonesia Timur"
 dei_path_b.4.d: "The diverse outer islands of the east are unified into a formidable federal state allied with the Crown."
 dei_path_b.4.a: "Inaugurate the federal government of NIT"

 dei_path_b.5.t: "The Netherlands-Indonesia Union"
 dei_path_b.5.d: "A historic treaty unites the Dutch Realm and the United States of Indonesia in a grand confederate partnership."
 dei_path_b.5.a: "Ratify the Union Statute"

 dei_path_b.6.t: "Granting Dominion Status"
 dei_path_b.6.d: "The East Indies transitions into a self-governing Dominion, standing shoulder-to-shoulder with the metropole."
 dei_path_b.6.a: "Proclaim the Dominion of the Indies"

 dei_path_b.7.t: "Joining the Dutch Commonwealth"
 dei_path_b.7.d: "Formalizing a permanent commonwealth alliance, integrating defense, trade, and diplomacy across both hemispheres."
 dei_path_b.7.a: "Finalize full commonwealth accession"

 dei_path_b.8.t: "A Stable Post-Colonial Equilibrium"
 dei_path_b.8.d: "Peace and prosperity return to the archipelago under the enduring umbrella of Dutch-Indonesian cooperation."
 dei_path_b.8.a: "Prosperity through partnership"

 #### EVENTS: Path C - Communist ####
 dei_path_c.1.t: "Triumph of the Front Rakyat"
 dei_path_c.1.d: "Workers, peasants, and revolutionary militias seize control in the cities, inaugurating a socialist republic."
 dei_path_c.1.a: "Proclaim the Indonesian People's Republic"

 dei_path_c.2.t: "Radical Land Reform"
 dei_path_c.2.d: "Colonial estates and feudal properties are confiscated and redistributed to tenant farmers."
 dei_path_c.2.a: "Execute swift and uncompromising redistribution"
 dei_path_c.2.b: "Organize state-supervised agricultural cooperatives"

 dei_path_c.3.t: "Purging Counter-Revolutionary Elements"
 dei_path_c.3.d: "The revolutionary vanguard moves to eliminate political saboteurs, landlords, and bourgeois agents."
 dei_path_c.3.a: "Purge without hesitation"
 dei_path_c.3.b: "Re-educate through compulsory labor"

 dei_path_c.4.t: "The Red People's Army"
 dei_path_c.4.d: "Transforming partisan fighters into a professional, politically indoctrinated socialist army."
 dei_path_c.4.a: "Empower political commissars in all divisions"
 dei_path_c.4.b: "Prioritize strict tactical competence"

 dei_path_c.5.t: "Soviet Alliance Signed"
 dei_path_c.5.d: "A formal mutual assistance pact is ratified with Moscow, securing tanks, aircraft, and diplomatic backing."
 dei_path_c.5.a: "Glory to proletarian internationalism"

 dei_path_c.6.t: "Pact with Revolutionary China"
 dei_path_c.6.d: "Forging fraternal solidarity with Beijing, committing to anti-imperialist struggle across the Asian mainland."
 dei_path_c.6.a: "Advance the Asian revolution"

 dei_path_c.7.t: "The Socialist Industrial Plan"
 dei_path_c.7.d: "The state mobilizes nationalized oil wells, tin mines, and factories to build a self-sufficient planned economy."
 dei_path_c.7.a: "Strive for industrial supremacy"

 dei_path_c.8.t: "Exporting Revolution"
 dei_path_c.8.d: "Providing weapons, safe haven, and training to communist guerrillas across Malaya and the Pacific rim."
 dei_path_c.8.a: "Liberate Southeast Asia"

 #### EVENTS: Path D - Authoritarian Militaristic ####
 dei_path_d.1.t: "The Military Council Takes Power"
 dei_path_d.1.d: "Declaring civilian leadership bankrupt, senior commanders stage an efficient coup to restore national discipline."
 dei_path_d.1.a: "Order and duty above all"

 dei_path_d.2.t: "Nationwide Martial Law"
 dei_path_d.2.d: "Curfews, tribunals, and military command posts are established in every regency across the islands."
 dei_path_d.2.a: "Maintain total civil obedience"

 dei_path_d.3.t: "Dissolution of Political Parties"
 dei_path_d.3.d: "Partisan squabbles are declared illegal. All civic life is consolidated into a single state front."
 dei_path_d.3.a: "One nation, one command"

 dei_path_d.4.t: "Building the Military-Industrial Complex"
 dei_path_d.4.d: "Heavy factories and munition plants are constructed under direct armed forces supervision."
 dei_path_d.4.a: "Expand production around the clock"

 dei_path_d.5.t: "Nationalist Youth Indoctrination"
 dei_path_d.5.d: "Mass rallies and paramilitary drills prepare the young generation for the supreme sacrifice."
 dei_path_d.5.a: "Foster an indomitable fighting spirit"

 dei_path_d.6.t: "Laskar Pelopor Mobilization"
 dei_path_d.6.d: "Hundreds of thousands of youth auxiliaries march in uniform, ready to support the armed forces."
 dei_path_d.6.a: "Equip and deploy the militias"

 dei_path_d.7.t: "Territorial Claims of Nusantara Raya"
 dei_path_d.7.d: "Proclaiming our destiny to unite all ancestral lands from Malaya to the Solomon Sea under our banner."
 dei_path_d.7.a: "Nusantara Raya shall rise"

 dei_path_d.8.t: "Southern Seas Hegemony"
 dei_path_d.8.d: "The nation stands ready to enforce its hegemony over the maritime crossroads of Asia."
 dei_path_d.8.a: "The straits are ours"

 #### EVENTS: Path E - Islamist ####
 dei_path_e.1.t: "Proclaiming the Negara Islam Indonesia"
 dei_path_e.1.d: "The Darul Islam movement raises the green banner, establishing an Islamic state dedicated to divine law."
 dei_path_e.1.a: "Bismillah — our struggle begins"

 dei_path_e.2.t: "Council of Ulama and Sharia"
 dei_path_e.2.d: "Venerable Islamic jurists convene to draft a legal system founded upon the Quran and Sunnah."
 dei_path_e.2.a: "Enact the sharia constitution"

 dei_path_e.3.t: "Consolidating the Tentara Islam Indonesia"
 dei_path_e.3.d: "Guerrilla battalions from West Java, Aceh, and South Sulawesi are forged into the regular armed forces of the state."
 dei_path_e.3.a: "Praise be to God"

 dei_path_e.4.t: "Islamic Education and Society"
 dei_path_e.4.d: "Pesantren networks receive state sponsorship to educate scholars, administrators, and youth in virtue."
 dei_path_e.4.a: "Nurture knowledge and faith"

 dei_path_e.5.t: "Alliance with the Muslim World"
 dei_path_e.5.d: "Envoys from Cairo, Riyadh, and Damascus arrive to celebrate the birth of an Islamic republic in Southeast Asia."
 dei_path_e.5.a: "Strengthen fraternal bonds"

 dei_path_e.6.t: "Neutralizing Secular Opposition"
 dei_path_e.6.d: "Remaining underground secular and communist agitators are rounded up to preserve public order."
 dei_path_e.6.a: "Secure the home front"

 dei_path_e.7.t: "The Islamic Welfare Treasury"
 dei_path_e.7.d: "State-organized zakat distribution ensures that no citizen in the commonwealth goes hungry."
 dei_path_e.7.a: "Justice and charity prevail"

 dei_path_e.8.t: "Pan-Islamic Unity Across the Seas"
 dei_path_e.8.d: "A grand congress in Batavia welcomes Muslim leaders from across Malaya, Borneo, and Mindanao."
 dei_path_e.8.a: "United in faith and brotherhood"

 #### EVENTS: Path F - Majapahit Revival ####
 dei_path_f.1.t: "Reawakening the Spirit of Majapahit"
 dei_path_f.1.d: "[AHISTORICAL] Antiquarians and court nobles inspire a popular movement to resurrect the fourteenth-century empire."
 dei_path_f.1.a: "Invoke the memory of Gajah Mada"

 dei_path_f.2.t: "Discovery of the Sacred Pusaka (Stage 1)"
 dei_path_f.2.d: "[AHISTORICAL] Archaeologists unearth ancient regalia in East Java, electrifying the revivalist movement."
 dei_path_f.2.a: "Display the relic publicly to rally the people"
 dei_path_f.2.b: "Keep it in the royal treasury as an elite symbol"

 dei_path_f.3.t: "Nationalist Reactions (Stage 2)"
 dei_path_f.3.d: "[AHISTORICAL] Conventional republican politicians criticize the neo-feudal revival as dangerous romanticism."
 dei_path_f.3.a: "Conciliate skeptical leaders"
 dei_path_f.3.b: "Dismiss criticism and march forward"

 dei_path_f.4.t: "Diplomatic Concern from Neighbors (Stage 3)"
 dei_path_f.4.d: "[AHISTORICAL] British authorities in Malaya and American diplomats in Manila observe the revival with deep suspicion."
 dei_path_f.4.a: "Reassure them this is cultural, not territorial"
 dei_path_f.4.b: "Maintain strategic ambiguity for future claims"

 dei_path_f.5.t: "The Dewan Adat Nusantara Convenes"
 dei_path_f.5.d: "[AHISTORICAL] Traditional rulers and adat elders from across the archipelago gather to pledge allegiance."
 dei_path_f.5.a: "Proceed"

 dei_path_f.6.t: "The Grand Maritime Fleet Reborn"
 dei_path_f.6.d: "[AHISTORICAL] Modern warships fly the red-and-white striped banner of ancient Majapahit across the straits."
 dei_path_f.6.a: "Rule the seas once more"

 dei_path_f.7.t: "Enforcing the Sumpah Palapa"
 dei_path_f.7.d: "[AHISTORICAL] Imperial decrees proclaim our historic right to unite all lands within the ancient sphere of influence."
 dei_path_f.7.a: "Declare broad claims over the entire region"
 dei_path_f.7.b: "Consolidate the core archipelago first"

 dei_path_f.8.t: "Uniting the Royal Houses"
 dei_path_f.8.d: "[AHISTORICAL] Sultans and rajas across Sumatra, Borneo, and the Moluccas are integrated into the imperial court."
 dei_path_f.8.a: "Unify through diplomacy and dynastic ties"
 dei_path_f.8.b: "Demonstrate overwhelming imperial power"

 dei_path_f.9.t: "Coronation of the New Empire"
 dei_path_f.9.d: "[AHISTORICAL] Before thousands of assembled subjects and dignitaries, the Emperor of Nusantara is crowned."
 dei_path_f.9.a: "Long live the Empire of Nusantara!"

 #### FLAVOR EVENTS: Archipelago Dynamics ####
 dei_flavor.1.t: "Voices of the Vernacular Press"
 dei_flavor.1.d: "Indigenous newspapers like Medan Prijaji and Bintang Timoer publish sharp critiques of colonial policies and social injustice. How shall the administration respond to their outspoken journalism?"
 dei_flavor.1.a: "Uphold freedom of the press"
 dei_flavor.1.b: "Tighten press censorship in the name of order"

 dei_flavor.2.t: "Bountiful Tropical Harvest"
 dei_flavor.2.d: "Plantations and smallholders across Sumatra, Java, and the Moluccas report an extraordinary harvest of rubber, tea, and spices. How shall we utilize this agricultural windfall?"
 dei_flavor.2.a: "Boost exports to international markets"
 dei_flavor.2.b: "Replenish local granaries and food reserves"

 dei_flavor.3.t: "Transport Workers Strike"
 dei_flavor.3.d: "Railway and dockworkers in Tanjung Priok and Surabaya walk off the job simultaneously, demanding living wages and humane working hours. Archipelago logistics are threatened with gridlock."
 dei_flavor.3.a: "Negotiate a fair wage settlement"
 dei_flavor.3.b: "Deploy security forces to break the strike"

 dei_flavor.4.t: "Festivities at Pasar Gambir"
 dei_flavor.4.d: "The annual folk festival and night bazaar at Pasar Gambir opens in Batavia. Gamelan music, regional crafts, and traditional cuisine bring joy and solidarity to hundreds of thousands."
 dei_flavor.4.a: "Celebrate the rich cultural heritage of our islands"

 dei_flavor.5.t: "Volcanic Eruption & Gotong Royong"
 dei_flavor.5.d: "A major volcanic eruption blankets villages and rice paddies in ash. Yet amid catastrophe, the timeless tradition of Gotong Royong shines through as communities rally to aid the stricken."
 dei_flavor.5.a: "Deploy soldiers and emergency relief brigades"
 dei_flavor.5.b: "Disburse emergency state reconstruction funds"

 dei_flavor.6.t: "Shortwave Radio Across the Archipelago"
 dei_flavor.6.d: "New shortwave radio broadcast towers now project sound across stormy straits and dense jungles. For the first time, distant communities in Borneo and the Moluccas listen to the same national voice."
 dei_flavor.6.a: "Broadcast national unity to every shore"

