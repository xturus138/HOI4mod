 #### EVENTS: Shared Trunk - Prolog Revolusi 1936 ####
 dei_trunk.1.t: "The 1936 General Strike Wave"
 dei_trunk.1.d: "Crippled by economic collapse, dockers at Tanjung Priok and Tanjung Perak join railway crews in a sweeping general strike. Defiant crowds fill public squares from Batavia to Surabaya, bringing colonial commerce to a dead halt."
 dei_trunk.1.a: "Deploy field constabulary and police batons"
 dei_trunk.1.b: "Offer a Volksraad wage commission inquiry"

 dei_trunk.2.t: "Mutiny in the KNIL Barracks"
 dei_trunk.2.d: "Native KNIL garrisons at Cimahi and Magelang break ranks, refusing orders to fire upon striking workers. Seizing armories, soldiers distribute rifles to youth militias, transforming civil protest into armed uprising."
 dei_trunk.2.a: "Distribute armaments to the fledgling Laskar Rakyat"
 dei_trunk.2.b: "Coordinate with youth leagues to secure ammunition depots"

 dei_trunk.3.t: "Political Crisis in Batavia"
 dei_trunk.3.d: "Colonial governance in Batavia collapses into disarray as civil servants stage mass walkouts. Inside the Volksraad, Indonesian delegates abandon the assembly en masse, declaring Dutch colonial authority null and void."
 dei_trunk.3.a: "The moral authority of the colonial state has collapsed"

 dei_trunk.4.t: "Consolidation of Underground Resistance"
 dei_trunk.4.d: "Meeting in clandestine safehouses across Java, nationalist leaders and strike committees establish an emergency revolutionary council, uniting labor, youth, and military defectors under a coordinated command."
 dei_trunk.4.a: "Prepare the proclamation of national sovereignty"

 dei_trunk.5.t: "Threshold of National Revolution"
 dei_trunk.5.d: "Colonial authority across the archipelago has dissolved. Clandestine radios broadcast revolutionary marches across the airwaves, and the Merah-Putih unfurls over civic squares as patriots prepare to declare sovereignty."
 dei_trunk.5.a: "The decisive hour has struck for all of Nusantara!"

 dei_trunk.6.t: "The 1936 Indonesian National Revolution"
 dei_trunk.6.d: "Across Java and Sumatra, the general strike has paralyzed colonial rule as dockers, railwaymen, and native KNIL soldiers join the national defiance. Over clandestine airwaves, the Proclamation of Independence rings out to the world as the Merah-Putih unfurls from Sabang to Merauke."
 dei_trunk.6.a: "Merdeka! The destiny of Nusantara is in our hands."
 dei_trunk.6.world: "A momentous revolution in Southeast Asia."

