 #### EXTENDED ARCHIPELAGO FLAVOR EVENTS (7 to 26) ####
 dei_flavor.7.t: "Bengawan Solo & The Keroncong Wave"
 dei_flavor.7.d: "From the riverside kampungs of Surakarta, Gesang's melancholic melody 'Bengawan Solo' spreads across the airwaves via NIROM radio. From Batavia to Ambon, citizens hum the timeless ballad, celebrating the eternal spirit of the great Javanese river."
 dei_flavor.7.a: "A soothing song for an awakening nation."

 dei_flavor.8.t: "Quinine Monopoly of the Priangan Highlands"
 dei_flavor.8.d: "The mist-shrouded cinchona plantations around Bandung and Lembang produce over ninety percent of the world's quinine bark, the indispensable shield against equatorial malaria. Global pharmaceutical syndicates vie desperately for guaranteed shipments."
 dei_flavor.8.a: "Cash in on our tropical medicinal monopoly."
 dei_flavor.8.b: "Stockpile medicine for our own troops and clinics."

 dei_flavor.9.t: "The Ombilin Collieries of Sawahlunto"
 dei_flavor.9.d: "Deep in the Barisan Mountains of West Sumatra, the Ombilin coal mines rattle with activity. Special rack-and-pinion steam locomotives labor tirelessly over steep mountain passes, hauling high-grade coal directly to the coastal coaling wharves of Teluk Bayur."
 dei_flavor.9.a: "Keep the coal trains rolling day and night."

 dei_flavor.10.t: "Tin Miners of Bangka and Belitung"
 dei_flavor.10.d: "The alluvial tin dredge excavations of Bangka and Belitung islands provide strategic metals critical for modern industrial canning, electrical wiring, and alloy munitions. Labor unions petition for improved rations and medical dispensaries."
 dei_flavor.10.a: "Maintain peak export production quotas."
 dei_flavor.10.b: "Improve miners' rations and field amenities."

 dei_flavor.11.t: "Bosscha Observatory & Equatorial Astronomy"
 dei_flavor.11.d: "Perched high in Lembang, the Bosscha Observatory serves as the premier astronomical outpost near the equator. Renowned scholars from Europe and Asia gather to catalog binary star systems and conduct groundbreaking solar observations."
 dei_flavor.11.a: "Grant state research stipends for precision lenses."
 dei_flavor.11.b: "A distinguished testament to our scientific standing."

 dei_flavor.12.t: "Pasteur Institute of Bandung: Vaccine Crusade"
 dei_flavor.12.d: "The Pasteur Institute in Bandung succeeds in manufacturing stable tropical vaccines against smallpox, cholera, and rabies. Mobile medical brigades journey by riverboat and foot to inoculate rural villagers across the outer islands."
 dei_flavor.12.a: "A triumph of public health and human dignity."

 dei_flavor.13.t: "Tamansiswa & The Wild School Controversy"
 dei_flavor.13.d: "Ki Hajar Dewantara's indigenous Tamansiswa schools defy rigid colonial regulations, teaching vernacular literacy, democratic ethics, and pride in native culture without government subsidies."
 dei_flavor.13.a: "Defend indigenous education against interference!"
 dei_flavor.13.b: "Seek a constructive regulatory compromise."

 dei_flavor.14.t: "Kongres Perempuan Indonesia Convenes"
 dei_flavor.14.d: "Hundreds of dynamic women activists, teachers, and intellectuals gather in Yogyakarta. The assembly demands adult literacy schools, legal protections against forced marriage, and equal civic standing."
 dei_flavor.14.a: "Honor the vital contributions of our women leaders."

 dei_flavor.15.t: "Intellectual Duel: Sukarno vs Natsir"
 dei_flavor.15.d: "A fierce philosophical debate erupts in journals between Sukarno's secular nationalist vision and Mohammad Natsir's Islamic democratic doctrine regarding the constitutional character of a future independent state."
 dei_flavor.15.a: "Embrace the secular inclusive nationalist synthesis."
 dei_flavor.15.b: "Affirm the profound Islamic heritage of Nusantara."

 dei_flavor.16.t: "Terang Boelan: Dawn of Archipelagic Cinema"
 dei_flavor.16.d: "The romantic adventure film 'Terang Boelan', starring Roekiah and Raden Mochtar, packs open-air cinemas and theaters across Southeast Asia with its enchanting tropical cinematography and melodious keroncong soundtrack."
 dei_flavor.16.a: "Our popular arts captivate the entire Orient."

 dei_flavor.17.t: "Commemoration of the Sumpah Pemuda"
 dei_flavor.17.d: "Youth congresses from Sumatra, Java, Celebes, and the Moluccas gather to reaffirm the sacred 1928 pledge: Satu Nusa, Satu Bangsa, Satu Bahasa Indonesia. Patriotic anthems echo through assembly halls."
 dei_flavor.17.a: "One Motherland, One Nation, One Language!"

 dei_flavor.18.t: "Memory of De Zeven Provinciën Mutiny"
 dei_flavor.18.d: "Sailors quietly remember the daring February 1933 mutiny aboard the ironclad De Zeven Provinciën off Sumatra, when native and European deckhands seized command together to protest colonial austerity."
 dei_flavor.18.a: "Enforce strict naval discipline across all decks."
 dei_flavor.18.b: "Address the legitimate grievances of our seamen."

 dei_flavor.19.t: "Restoring the Colossus of Borobudur"
 dei_flavor.19.d: "Careful archaeological stabilization of the magnificent eighth-century Mahayana monument of Borobudur and the Prambanan temple compound concludes. Thousands of domestic and foreign travelers marvel at the stone relief stupas."
 dei_flavor.19.a: "An immortal testament to ancient architectural genius."

 dei_flavor.20.t: "The Roar of Karapan Sapi in Madura"
 dei_flavor.20.d: "The annual bull-racing spectacles in Madura draw tens of thousands of cheering spectators. Yoked pairs of decorated bulls thunder across dried paddy fields, celebrating agrarian vigor and breeding excellence."
 dei_flavor.20.a: "A magnificent display of rural passion and vitality."

 dei_flavor.21.t: "Malacca Strait Blockade Runners"
 dei_flavor.21.d: "Swift coastal perahus slip through foggy channels between the Riau Archipelago and the Malay coast, evading customs cutters while transporting clandestine supplies and trading goods."
 dei_flavor.21.a: "Intercept the cargo for our national defense depots."
 dei_flavor.21.b: "Crack down to uphold strict maritime order."

 dei_flavor.22.t: "Ratu Adil Prophecies in the Rural Heartlands"
 dei_flavor.22.d: "Amidst economic tremors, wandering mystics preach the imminent arrival of the Just King (Ratu Adil) who will banish poverty and tyranny. Rural peasants gather in watchful anticipation."
 dei_flavor.22.a: "Address peasant economic grievances with land reform."
 dei_flavor.22.b: "Maintain public vigilance and restore civil order."

 dei_flavor.23.t: "Pinisi Voyagers & The Dobo Pearl Trade"
 dei_flavor.23.d: "A flotilla of great Pinisi schooners returns to Makassar from the Aru Islands, laden with lustrous mother-of-pearl, dried sea cucumbers, and exotic spices gathered across the eastern rim of the archipelago."
 dei_flavor.23.a: "The ancient maritime arteries beat strong."

 dei_flavor.24.t: "First Wings Over Maguwo"
 dei_flavor.24.d: "At the Maguwo airfield near Yogyakarta, pioneering aviator Agustinus Adisucipto conducts daring training sorties in modified canvas-and-wood training craft, training the nucleus of a future air service."
 dei_flavor.24.a: "The eagles of the equator take flight!"

 dei_flavor.25.t: "Laskar Putri & Emergency Field Brigades"
 dei_flavor.25.d: "Thousands of courageous young women organize into Laskar Putri and emergency field hospital units, providing combat first-aid, message-running, and vital logistical support to frontline soldiers."
 dei_flavor.25.a: "Their courage strengthens the backbone of total defense!"

 dei_flavor.26.t: "Industrial Incident at Pangkalan Brandan"
 dei_flavor.26.d: "A high-pressure crude separation tower bursts into flames at the historic Pangkalan Brandan oil fields in North Sumatra. Emergency fire teams battle the inferno to protect vital fuel stockpiles."
 dei_flavor.26.a: "Dispatch emergency salvage and repair crews immediately."
 dei_flavor.26.b: "Salute the bravery of the oil field firefighters."


  # =========================================================================
  # V1.3 EXPANDED IDEOLOGY PATH FOCUSES & EVENTS
  # =========================================================================

  # Path A - Republik Demokratis Focuses
  dei_focus_a_kaa_bandung: "Konferensi Asia-Afrika Bandung"
  dei_focus_a_kaa_bandung_desc: "Host the historic Bandung Asian-African Conference, assembling delegates from newly sovereign nations across Asia and Africa to forge the Ten Principles of Bandung (*Dasasila Bandung*) and lead the non-aligned world."
  dei_focus_a_trikora: "Komando Trikora"
  dei_focus_a_trikora_desc: "Proclaim the Tri Komando Rakyat (*Trikora*) to liberate West Irian from foreign colonial rule, mobilizing regular armed forces, volunteer battalions, and diplomatic pressure to reclaim our national borders."
  dei_focus_a_dekrit_presiden: "Dekrit Presiden & Demokrasi Terpimpin"
  dei_focus_a_dekrit_presiden_desc: "Issue a decisive Presidential Decree to break parliamentary gridlock, reinstating the 1945 Constitution (*UUD 1945*) and establishing Guided Democracy (*Demokrasi Terpimpin*) to steer the revolutionary nation."
  dei_focus_a_dwikora: "Komando Dwikora"
  dei_focus_a_dwikora_desc: "Announce the Dwi Komando Rakyat (*Dwikora*) to confront imperialist encirclement in the region, standing firm against neo-colonial designs across the archipelagic waters."
  dei_focus_a_pancasila: "Kedaulatan Falsafah Pancasila"
  dei_focus_a_pancasila_desc: "Cement Pancasila as the eternal, unifying philosophical foundation of the Republic, harmonizing belief in God, humanitarianism, national unity, deliberative democracy, and social justice."
  dei_focus_a_trisakti: "Doktrin Trisakti"
  dei_focus_a_trisakti_desc: "Proclaim the eternal doctrine of Trisakti: political sovereignty (*berdaulat dalam politik*), economic self-reliance (*berdikari dalam ekonomi*), and cultural dignity (*berkepribadian dalam kebudayaan*)."

  # Path A Events
  dei_path_a.10.t: "The Asian-African Conference in Bandung"
  dei_path_a.10.d: "Representatives from dozens of newly sovereign nations across Asia and Africa have gathered in the cool mountain city of Bandung. Amid cheers from crowds packing the streets, world leaders convene to voice solidarity against imperialism and forge the Ten Principles of peaceful coexistence (*Dasasila Bandung*)."
  dei_path_a.10.a: "Let a new world be born from Bandung!"
  dei_path_a.11.t: "Proclamation of Komando Trikora"
  dei_path_a.11.d: "Before hundreds of thousands gathered in the grand square of Yogyakarta, the President steps up to the rostrum. In a thunderous speech, he issues the Tri Komando Rakyat: thwart the establishment of a puppet colonial state, raise the Sang Saka Merah Putih in West Irian, and prepare total mobilization to defend national independence."
  dei_path_a.11.a: "Irian Barat must return to the motherland!"
  dei_path_a.12.t: "The Presidential Decree of 1959"
  dei_path_a.12.d: "With the Constituent Assembly deadlocked after years of contentious debate, decisive executive action has become urgent. With the full backing of General Nasution and the military command, the President dissolves the Konstituante and reinstates the revolutionary 1945 Constitution (*UUD 1945*)."
  dei_path_a.12.a: "Kembali ke UUD 1945!"
  dei_path_a.13.t: "Komando Dwikora Mobilization"
  dei_path_a.13.d: "Facing perceived neo-colonial encircling maneuvers on the northern frontier, the Republic issues the Dwi Komando Rakyat (*Dwikora*). Volunteers and commandos prepare along the maritime straits, determined to safeguard revolutionary sovereignty against imperialist encroachment."
  dei_path_a.13.a: "Crush the neo-colonial threat!"
  dei_path_a.14.t: "Pancasila as the Eternal Foundation"
  dei_path_a.14.d: "A grand national seminar in Jakarta formally codifies Pancasila as the immutable soul of the Indonesian nation. Bridging ethnic, religious, and political divides, the Five Principles are etched permanently into national education, civic law, and military oath."
  dei_path_a.14.a: "Pancasila Abadi!"
  dei_path_a.15.t: "Proclamation of Doktrin Trisakti"
  dei_path_a.15.d: "Addressing parliament and mass organizations, the leadership unveils the Trisakti manifesto: Sovereign in politics, self-reliant in economy, and dignified in national culture. The republic vows never to kneel to foreign financial intimidation or cultural subversion."
  dei_path_a.15.a: "Berdikari! Stand on our own two feet!"

  # Path B - Kolonial / Federalis Focuses
  dei_focus_b_sidang_bfo: "Sidang Raya BFO"
  dei_focus_b_sidang_bfo_desc: "Convene the grand congress of the Bijeenkomst voor Federaal Overleg (*BFO*), ratifying equal constitutional partnership between the federal states (*Negara Bagian*) and guaranteeing regional autonomy."
  dei_focus_b_angkatan_federal: "Angkatan Bersenjata Federalis"
  dei_focus_b_angkatan_federal_desc: "Reorganize our armed forces into a professional federal defense corps, integrating experienced KNIL veterans with local state security regiments to defend the commonwealth."
  dei_focus_b_pakta_anzac: "Perjanjian Keamanan ANZAC"
  dei_focus_b_pakta_anzac_desc: "Sign mutual defense and naval patrol agreements with Australia and New Zealand, securing the Timor Sea, Torres Strait, and archipelagic maritime security."
  dei_focus_b_perkebunan_deli: "Modernisasi Perkebunan Deli"
  dei_focus_b_perkebunan_deli_desc: "Expand the great agro-industrial estates of Deli, Sumatra, and Java through modern agronomic investment and Dutch-Indonesian commercial syndicates."
  dei_focus_b_otonomi_kerajaan: "Piagam Perlindungan Swapraja"
  dei_focus_b_otonomi_kerajaan_desc: "Issue charters of royal protection and financial security to the traditional Kraton, Sultans, and Swapraja princes across the archipelago, preserving aristocratic heritage."
  dei_focus_b_pelabuhan_bebas: "Jaringan Pelabuhan Bebas Nusantara"
  dei_focus_b_pelabuhan_bebas_desc: "Designate Batavia, Surabaya, and Sabang as premier international free trade ports, abolishing burdensome tariffs to attract international maritime shipping."

  # Path B Events
  dei_path_b.9.t: "The Grand BFO Federal Summit"
  dei_path_b.9.d: "Delegates from Negara Pasundan, Negara Indonesia Timur, Negara Sumatra Timur, and various autonomous regencies gather in Batavia. The BFO treaty cements a modern federal structure where each territory maintains local laws while sharing common fiscal and foreign policies."
  dei_path_b.9.a: "Long live the Federal Union!"
  dei_path_b.10.t: "Commissioning the Federal Armed Forces"
  dei_path_b.10.d: "A grand military parade in Bandung reviews the unified Federal Defense Force. Veteran KNIL officers, regional gendarmes, and colonial brigades march side by side under a shared federal banner, dedicated to defending stability and order."
  dei_path_b.10.a: "Order and discipline shall prevail."
  dei_path_b.11.t: "Ratification of the ANZAC Security Pact"
  dei_path_b.11.d: "Diplomats in Canberra and Batavia sign the bilateral maritime security accord. Royal Australian Navy warships and federal patrol vessels begin joint reconnaissance operations to safeguard Pacific sea routes against aggression."
  dei_path_b.11.a: "Our southern maritime flanks are secure."
  dei_path_b.12.t: "The Agricultural Boom of Deli"
  dei_path_b.12.d: "Modern agronomic machinery, drainage engineering, and cooperative contracts have triggered an export surge in Deli tobacco, Sumatran rubber, and Javan sugar. Foreign exchange reserves reach unprecedented heights."
  dei_path_b.12.a: "Prosperity through enterprise and commerce."
  dei_path_b.13.t: "The Sovereign Charters of the Kraton"
  dei_path_b.13.d: "The Federal Government formally bestows hereditary royal charters to the traditional Sultans of Yogyakarta, Surakarta, Deli, Siak, Kutai, and Tidore. The royal families pledge loyalty to the federal constitution in exchange for perpetual cultural autonomy."
  dei_path_b.13.a: "Honoring our timeless aristocratic heritage."
  dei_path_b.14.t: "Grand Opening of the Free Ports"
  dei_path_b.14.d: "Customs barriers are officially dismantled at the deepwater docks of Tanjung Priok, Tanjung Perak, and Sabang. International merchant fleets from across the globe drop anchor, transforming our harbors into the premier trade hubs of Southeast Asia."
  dei_path_b.14.a: "The crossroads of world commerce!"

  # Path C - Komunis Focuses
  dei_focus_c_komune_tani: "Kolektivisasi Komune Tani"
  dei_focus_c_komune_tani_desc: "Establish agricultural communes and rural Soviets across Java and Sumatra, redistributing landlord estates to landless sharecroppers and organizing collective farming."
  dei_focus_c_sita_aset_asing: "Nasionalisasi Aset Imperialis"
  dei_focus_c_sita_aset_asing_desc: "Expropriate and nationalize all foreign-owned colonial enterprises, plantations, mines, and banks without compensation, placing economic power firmly in workers' hands."
  dei_focus_c_angkatan_kelima: "Pembentukan Angkatan Kelima"
  dei_focus_c_angkatan_kelima_desc: "Arm workers and peasants into the Fifth Force (*Angkatan Kelima*), establishing a massive proletarian defense militia capable of protecting the revolution against reactionaries."
  dei_focus_c_lekra: "Mobilisasi Budaya LEKRA"
  dei_focus_c_lekra_desc: "Mobilize the Institute of People's Culture (*LEKRA*), directing arts, literature, music, and theater toward revolutionary mass education and socialist realism."
  dei_focus_c_pakta_asia_merah: "Poros Anti-Imperialis Asia"
  dei_focus_c_pakta_asia_merah_desc: "Forge an unbreakable revolutionary anti-imperialist axis with sister socialist republics across the globe, resisting Western capitalist hegemony."
  dei_focus_c_pembangunan_semesta: "Pembangunan Semesta Berencana"
  dei_focus_c_pembangunan_semesta_desc: "Enact the Universal Planned Development program (*Pembangunan Semesta*), channeling national resources into heavy state metallurgy, mechanization, and socialist industrialization."

  # Path C Events
  dei_path_c.9.t: "The Agrarian Communes of Java"
  dei_path_c.9.d: "Red banners wave over rice paddies and rubber estates as thousands of peasant families join together in socialist agrarian communes (*Komune Tani*). Landlord estates have been expropriated and redistributed to those who cultivate the soil."
  dei_path_c.9.a: "Land to the tiller! Hidup Buruh dan Tani!"
  dei_path_c.10.t: "Seizure of Foreign Monopolies"
  dei_path_c.10.d: "Worker committees have marched into the executive offices of Dutch trading companies, Anglo-Dutch oil facilities, and British plantations. All imperialist corporate assets are nationalized under state syndicates without compensation."
  dei_path_c.10.a: "The wealth of Indonesia belongs to its people!"
  dei_path_c.11.t: "The Arming of the Fifth Force"
  dei_path_c.11.d: "Crates of rifles, submachine guns, and field radios are distributed to worker and peasant militias in industrial suburbs and rural villages. The newly inaugurated Angkatan Kelima stands ready to defend the revolution with blood and iron."
  dei_path_c.11.a: "Workers and peasants with rifles in hand!"
  dei_path_c.12.t: "The Cultural Congress of LEKRA"
  dei_path_c.12.d: "Authors, poets, and folk musicians pack the National Theater for the LEKRA plenary session. The doctrine of 'Politics as Commander' (*Politik adalah Panglima*) is cheered as artists pledge to create revolutionary literature accessible to the masses."
  dei_path_c.12.a: "Art serves the working class!"
  dei_path_c.13.t: "The Red Asian Anti-Imperialist Treaty"
  dei_path_c.13.d: "Delegates from international socialist powers arrive in Jakarta to ratify the Red Asian Alliance. Mutual defense guarantees, military assistance, and socialist trade agreements are officially enacted."
  dei_path_c.13.a: "Together we shatter imperialist chains!"
  dei_path_c.14.t: "Universal Industrial Plan Launched"
  dei_path_c.14.d: "The Central Planning Committee unrolls the blueprints for the Eight-Year Universal Development Plan. Heavy steel foundries in Cilegon, chemical fertilizer plants in Palembang, and rural electrification programs begin round-the-clock operations."
  dei_path_c.14.a: "Forward to socialist industrialization!"

  # Path D - Otoriter Militeristik Focuses
  dei_focus_d_dewan_revolusi: "Dewan Revolusi Militer Tertinggi"
  dei_focus_d_dewan_revolusi_desc: "Form the Supreme Military Revolutionary Council, dissolving corrupt party politics and subordinating civil government directly to the command of the Armed Forces."
  dei_focus_d_karyawan_abri: "Doktrin Dwifungsi ABRI"
  dei_focus_d_karyawan_abri_desc: "Institutionalize the Dual Function (*Dwifungsi*) doctrine, appointing disciplined military commanders to manage state-owned enterprises, civic infrastructure, and regional governorships."
  dei_focus_d_benteng_samudra: "Benteng Samudra Nusantara"
  dei_focus_d_benteng_samudra_desc: "Fortify our archipelagic straits with hardened coastal fortresses, heavy naval batteries, and air-defense perimeters, turning the Indonesian seas into an impregnable redoubt."
  dei_focus_d_wajib_militer: "Mobilisasi Bela Negara Menyeluruh"
  dei_focus_d_wajib_militer_desc: "Implement universal conscription and mandatory national defense training (*Bela Negara*) for all youth, turning the whole nation into a disciplined, combat-ready force."
  dei_focus_d_komando_selat: "Pusat Komando Strategis Selat Malaka"
  dei_focus_d_komando_selat_desc: "Establish unified air and maritime strike wings guarding the Strait of Malacca, giving our command total surveillance and interdiction authority over all maritime traffic."
  dei_focus_d_hegemoni_selatan: "Hegemoni Militer Samudra Hindia"
  dei_focus_d_hegemoni_selatan_desc: "Expand our navy and strategic bomber squadrons to project decisive military dominance across the Indian Ocean and the South Seas."

  # Path D Events
  dei_path_d.9.t: "The Military Revolutionary Council Takes Control"
  dei_path_d.9.d: "Armored vehicles surround the parliament building in Jakarta as generals read a stern proclamation over national radio. Inept partisan politics is declared abolished; the Supreme Military Revolutionary Council assumes total executive and judicial power."
  dei_path_d.9.a: "Only iron military discipline can save the nation!"
  dei_path_d.10.t: "Implementation of Dwifungsi ABRI"
  dei_path_d.10.d: "Senior army, navy, and air force commanders are officially appointed as ministers, governors, and directors of state industrial monopolies. The Dwifungsi doctrine binds national development and martial command into an inseparable whole."
  dei_path_d.10.a: "Soldiers and administrators in one breath."
  dei_path_d.11.t: "Fortress Archipelago Completed"
  dei_path_d.11.d: "Engineers have completed the fortifications guarding the Sunda, Lombok, and Makassar straits. Heavy coastal artillery bunkers, submarine pens, and radar stations now oversee every choke point in archipelagic waters."
  dei_path_d.11.a: "Not an enemy ship shall pass unchallenged."
  dei_path_d.12.t: "Universal Conscription Under Bela Negara"
  dei_path_d.12.d: "Conscription depots across Java, Sumatra, and Sulawesi overflow as hundreds of thousands of youth report for military drill. Patriotism and martial discipline become the core of civic education."
  dei_path_d.12.a: "Every citizen a soldier!"
  dei_path_d.13.t: "Command of the Malacca Strait"
  dei_path_d.13.d: "From fortified command bunkers overlooking the Strait of Malacca, coastal radars and torpedo craft monitor all merchant and naval traffic. No foreign power can pass between East Asia and Europe without our permission."
  dei_path_d.13.a: "The maritime gateway is ours!"
  dei_path_d.14.t: "Southern Ocean Hegemony Proclaimed"
  dei_path_d.14.d: "With battleships, cruisers, and long-range bomber wings conducting live-fire drills across the Indian Ocean, international military observers concede that our armed forces are the unquestioned hegemon of Southeast Asia."
  dei_path_d.14.a: "Our supremacy is uncontested."

  # Path E - Islamis / NII Focuses
  dei_focus_e_baitul_mal: "Pendirian Baitul Mal Pusat"
  dei_focus_e_baitul_mal_desc: "Establish a central *Baitul Mal* treasury to administer public revenues, state assets, and compulsory zakat distribution, guaranteeing comprehensive welfare for all believers."
  dei_focus_e_mahkamah_syariah: "Mahkamah Syariah Tertinggi"
  dei_focus_e_mahkamah_syariah_desc: "Codify *Qanun* legislation and establish a Supreme Sharia Court, bringing civic, criminal, and commercial statutes into pure alignment with Islamic jurisprudence."
  dei_focus_e_akademi_mujahidin: "Akademi Militer Mujahidin"
  dei_focus_e_akademi_mujahidin_desc: "Reorganize military training academies into dedicated Mujahidin officer colleges, instilling tactical expertise and fiery spiritual conviction in every cadet."
  dei_focus_e_hapus_riba: "Sistem Keuangan Muamalah Tanpa Riba"
  dei_focus_e_hapus_riba_desc: "Abolish usury (*riba*) across the financial sector, replacing conventional interest with profit-and-loss sharing (*mudharabah*) and asset-backed Islamic banking."
  dei_focus_e_liga_muslim: "Liga Perjuangan Muslim Sedunia"
  dei_focus_e_liga_muslim_desc: "Dispatch religious envoys and military attaches to Muslim nations and anti-colonial resistance movements worldwide, building global Islamic brotherhood."
  dei_focus_e_khilafah_nusantara: "Khilafah Islamiyah Nusantara"
  dei_focus_e_khilafah_nusantara_desc: "Proclaim the sovereign Archipelagic Caliphate (*Khilafah Islamiyah Nusantara*), uniting all believers from Sabang to Merauke under the divine banner of righteousness."

  # Path E Events
  dei_path_e.9.t: "Inauguration of the Baitul Mal"
  dei_path_e.9.d: "The Supreme Shura Council proclaims the formal opening of the central Baitul Mal treasury. Zakat from wealthy merchants, agricultural tithes, and revenues from natural resources are pooled to eradicate poverty and support public welfare."
  dei_path_e.9.a: "Justice and welfare under the law of God."
  dei_path_e.10.t: "Promulgation of Qanun Sharia Laws"
  dei_path_e.10.d: "From the Supreme Sharia Court in Bandung, the grand judges read the newly enacted *Qanun* penal and civil codes. Colonial legal remnants are swept aside in favor of Islamic jurisprudence."
  dei_path_e.10.a: "Divine justice has triumphed!"
  dei_path_e.11.t: "First Graduates of the Mujahidin Academy"
  dei_path_e.11.d: "Cadets dressed in green uniforms with silver crescent insignias take their solemn oath of jihad and loyalty to the state. These Mujahidin commanders combine battlefield tacticians with deep religious scholarship."
  dei_path_e.11.a: "Fighters for faith and motherland!"
  dei_path_e.12.t: "Abolition of Riba and Islamic Banking"
  dei_path_e.12.d: "All commercial banks and financial institutions are officially transitioned to interest-free muamalah contracts based on mudharabah and musyarakah. Merchants and farmers celebrate liberation from predatory debt."
  dei_path_e.12.a: "Praise be to God for equitable commerce."
  dei_path_e.13.t: "The Pan-Islamic Solidarity Congress"
  dei_path_e.13.d: "Envoys from Egypt, Syria, Yemen, Pakistan, and Malaya gather in Java to inaugurate the World Muslim Solidarity League. Pledges of mutual defense and religious cooperation echo across the hall."
  dei_path_e.13.a: "The Ummah stands united!"
  dei_path_e.14.t: "Proclamation of Khilafah Nusantara"
  dei_path_e.14.d: "In a solemn ceremony accompanied by prayers and traditional gamelan hymns in the great mosque, the Amir is consecrated as the spiritual and temporal guardian of Khilafah Islamiyah Nusantara. Green flags fly across every province."
  dei_path_e.14.a: "Allahu Akbar! The Caliphate is established!"

  # Path F - Majapahit Focuses
  dei_focus_f_sumpah_palapa_baru: "Pemenuhan Sumpah Palapa Baru"
  dei_focus_f_sumpah_palapa_baru_desc: "Renew Mahapatih Gajah Mada's legendary Palapa Oath, declaring that no feast or rest shall be enjoyed until all archipelagic realms are united under the sacred imperial throne."
  dei_focus_f_restorasi_trowulan: "Restorasi Ibu Kota Suci Trowulan"
  dei_focus_f_restorasi_trowulan_desc: "Excavate and rebuild the ancient imperial city of Trowulan, raising stone temples (*candi*), royal pavilions, and sacred pools to honor the heritage of our emperors."
  dei_focus_f_dharmaputra: "Pembentukan Resimen Dharmaputra"
  dei_focus_f_dharmaputra_desc: "Resurrect the elite warrior order of the *Dharmaputra*, noble knights bound by eternal blood oaths to protect the Maharaja and crush treason."
  dei_focus_f_jung_raksasa: "Armada Jung Samudera Majapahit"
  dei_focus_f_jung_raksasa_desc: "Construct magnificent multi-decked archipelagic war junks and armored naval vessels, reviving the maritime supremacy that ruled the southern oceans in centuries past."
  dei_focus_f_kitab_kutaramanawa: "Kodifikasi Hukum Kutaramanawa"
  dei_focus_f_kitab_kutaramanawa_desc: "Reinstate the classical Majapahit legal codex *Kutaramanawa Dharmasastra*, establishing uncompromising imperial discipline, civic duties, and social harmony."
  dei_focus_f_penobatan_maharaja: "Penobatan Maharaja Nusantara Raya"
  dei_focus_f_penobatan_maharaja_desc: "Conduct the supreme coronation (*Abhiseka*) of the Emperor under the golden Surya Majapahit, heralding an eternal golden era of glory, righteousness, and maritime dominion."

  # Path F Events
  dei_path_f.10.t: "The Sacred Renewal of Sumpah Palapa"
  dei_path_f.10.d: "Standing upon the ancient stone podium before a massive crowd of imperial subjects, the court chamberlain reads the sacred Sumpah Palapa. The nation swears never to rest until all archipelagic lands and seas are unified under one throne."
  dei_path_f.10.a: "Sirna Ilang Kertaning Bumi! Nusantara shall be one!"
  dei_path_f.11.t: "The Rebirth of Sacred Trowulan"
  dei_path_f.11.d: "Archaeologists, stonemasons, and imperial builders complete the restoration of Trowulan. Red brick gateway arches (*Candi Bajang Ratu*), sacred baths, and grand council halls gleam once more under the tropical sun."
  dei_path_f.11.a: "The ancestral capital lives again!"
  dei_path_f.12.t: "The Consecration of the Dharmaputra"
  dei_path_f.12.d: "Seven chosen warrior-generals kneel before the royal dais to receive sacred heirloom keris daggers (*Keris Pusaka*). The Dharmaputra regiment swears absolute loyalty to the Emperor, prepared to extinguish any rebellion."
  dei_path_f.12.a: "Honor to the Dharmaputra!"
  dei_path_f.13.t: "Launch of the Imperial Jung Warships"
  dei_path_f.13.d: "Massive four-masted war vessels, constructed from ironwood and reinforced with heavy naval cannons, slide into the waters off the dockyards of Gresik and Tuban. The naval majesty of Majapahit once again commands the seas."
  dei_path_f.13.a: "Rule the southern waves!"
  dei_path_f.14.t: "Promulgation of Kutaramanawa Dharmasastra"
  dei_path_f.14.d: "Royal judges read the ancient eighteen chapters of Kutaramanawa law in court. Unjust corruption, banditry, and disloyalty are met with swift imperial justice, restoring harmony (*kertaraharja*) throughout the realm."
  dei_path_f.14.a: "Righteous order reigns across the islands."
  dei_path_f.15.t: "The Coronation of the Supreme Maharaja"
  dei_path_f.15.d: "Trumpets, gongs, and sacred gamelan fanfare resound through the great throne hall of Trowulan. Crowned with the golden Makuta under the radiant Surya Majapahit emblem, the Maharaja is proclaimed Emperor of All Nusantara."
  dei_path_f.15.a: "Jayalah Majapahit! Dirgahayu Maharaja!"

  # Custom Ideas for Expanded Ideologies
  dei_idea_kaa_spirit: "Spirit of Bandung"
  dei_idea_kaa_spirit_desc: "The Ten Principles of Bandung give our republic immense international moral prestige and solidarity with non-aligned nations."
  dei_idea_trikora_mobilization: "Trikora Total Mobilization"
  dei_idea_trikora_mobilization_desc: "Volunteers and military units are mobilized to the highest pitch of readiness to liberate lost territories."
  dei_idea_dwikora_confrontation: "Dwikora Revolutionary Alert"
  dei_idea_dwikora_confrontation_desc: "Our forces maintain vigilant forward posture against imperialist encirclement across archipelagic sea lanes."
  dei_idea_pancasila_philosophy: "Falsafah Pancasila"
  dei_idea_pancasila_philosophy_desc: "The five foundational principles bind our diverse ethnic and religious populations into an unbreakable national unity."
  dei_idea_trisakti_doctrine: "Doktrin Trisakti"
  dei_idea_trisakti_doctrine_desc: "Sovereign in politics, self-reliant in economics, and dignified in culture — our people refuse foreign domination."
  dei_idea_federal_commonwealth: "Federal Commonwealth Accord"
  dei_idea_federal_commonwealth_desc: "Autonomy for constituent states maintains peaceful balance and administrative efficiency across the islands."
  dei_idea_anzac_treaty: "ANZAC Security Guarantee"
  dei_idea_anzac_treaty_desc: "Joint naval and defense pacts with Australia and New Zealand guarantee security in southern oceans."
  dei_idea_deli_plantations: "Syndicated Plantations"
  dei_idea_deli_plantations_desc: "Modern capital investment and export agriculture provide stable revenue and foreign exchange."
  dei_idea_royal_autonomy: "Protected Royal Swapraja"
  dei_idea_royal_autonomy_desc: "Traditional sultans and royal houses maintain local loyalty, reducing unrest and strengthening regional administration."
  dei_idea_free_ports: "Nusantara Free Ports"
  dei_idea_free_ports_desc: "Tariff-free archipelagic ports attract bustling international trade and naval commerce."
  dei_idea_agrarian_communes: "Kolektif Komune Tani"
  dei_idea_agrarian_communes_desc: "Peasant communes maximize agricultural yield and fuel rapid socialist industrialization."
  dei_idea_nationalized_assets: "Nationalized Imperialist Wealth"
  dei_idea_nationalized_assets_desc: "Expropriated foreign enterprises are reinvested directly into public development and workers' welfare."
  dei_idea_angkatan_kelima: "Armed Workers & Peasants"
  dei_idea_angkatan_kelima_desc: "Mass proletarian militias stand ready to defend factories and villages against counter-revolution."
  dei_idea_lekra_culture: "LEKRA Proletarian Culture"
  dei_idea_lekra_culture_desc: "Art, drama, and literature actively educate and mobilize the masses for revolutionary socialist reconstruction."
  dei_idea_semesta_development: "Universal Planned Development"
  dei_idea_semesta_development_desc: "Centrally directed 8-year industrial planning accelerates heavy manufacturing and state infrastructure."
  dei_idea_dewan_revolusi: "Supreme Military Council"
  dei_idea_dewan_revolusi_desc: "Centralized command structure removes parliamentary delays, enforcing iron order across the state."
  dei_idea_karyawan_abri: "Dwifungsi ABRI Administration"
  dei_idea_karyawan_abri_desc: "Officers serving as civilian administrators bring unmatched logistical discipline to state operations."
  dei_idea_maritime_fortress: "Fortress Archipelago"
  dei_idea_maritime_fortress_desc: "Coastal batteries and fortified straits ensure control over key maritime passageways."
  dei_idea_total_conscription: "Bela Negara Conscription"
  dei_idea_total_conscription_desc: "Every citizen undergoes martial training, expanding our mobilizable manpower pool."
  dei_idea_strait_hegemony: "Sovereign Strait Dominance"
  dei_idea_strait_hegemony_desc: "Absolute naval dominance over the Malacca and Sunda straits projects regional power."
  dei_idea_baitul_mal: "Baitul Mal Welfare System"
  dei_idea_baitul_mal_desc: "Public wealth and zakat tithes provide social stability and fund communal infrastructure."
  dei_idea_sharia_judiciary: "Qanun Sharia Jurisprudence"
  dei_idea_sharia_judiciary_desc: "Uniform divine jurisprudence reduces social crime and creates unbreakable communal harmony."
  dei_idea_mujahidin_spirit: "Mujahidin Officer Cadre"
  dei_idea_mujahidin_spirit_desc: "Cadets trained in elite combat and spiritual conviction fight with fearless devotion."
  dei_idea_islamic_banking: "Interest-Free Banking"
  dei_idea_islamic_banking_desc: "Abolition of predatory interest spurs cooperative trade and ethical investments."
  dei_idea_liga_muslim: "Pan-Islamic League Alliance"
  dei_idea_liga_muslim_desc: "International Muslim solidarity provides diplomatic backing and volunteers."
  dei_idea_nusantara_caliphate: "Archipelagic Caliphate"
  dei_idea_nusantara_caliphate_desc: "The sacred mission of the caliphate unites believers from across the seas under one divine purpose."
  dei_idea_palapa_oath: "Sumpah Palapa Vow"
  dei_idea_palapa_oath_desc: "The sacred vow of unity inspires the nation to unceasing determination."
  dei_idea_dharmaputra_guard: "Dharmaputra Imperial Guard"
  dei_idea_dharmaputra_guard_desc: "Elite warrior knights sworn to defend the emperor ensure royal authority is unshakeable."
  dei_idea_jung_navy: "Imperial Naval Supremacy"
  dei_idea_jung_navy_desc: "Reinvigorated naval traditions give our fleet tactical advantage in archipelagic waters."
  dei_idea_kutaramanawa_law: "Kutaramanawa Justice"
  dei_idea_kutaramanawa_law_desc: "Ancient legal codices enforce uncompromising social discipline and civic loyalty."
  dei_idea_surya_majapahit: "Radiant Surya Majapahit"
  dei_idea_surya_majapahit_desc: "The golden sun of Majapahit heralds a restored imperial empire feared and respected across all seas."


  # =========================================================================
  # STRATEGIC RESEARCH DIRECTIONS, ARMY TEMPLATES & EQUIPMENT VARIANTS (V1.4)
  # =========================================================================

  # Decision Category
  dei_decisions_research_doctrines: "Strategic Military Doctrines & Research Directions"
  dei_decisions_research_doctrines_desc: "Establish sovereign military doctrines, technological development priorities, and domestic alutsista standardization across the armed forces."

  # Decisions
  dei_decision_doktrin_gerilya_wilayah: "Doktrin Perang Wilayah & Gerilya Semesta"
  dei_decision_doktrin_gerilya_wilayah_desc: "Formulate a comprehensive territorial and guerrilla warfare doctrine (*Sishanrata*), training soldiers and popular militias to use archipelagic terrain, jungles, and mountain ridges to bog down any invading force."
  dei_decision_doktrin_gerilya_laut: "Doktrin Pertahanan Selat Dangkal & Gerilya Laut"
  dei_decision_doktrin_gerilya_laut_desc: "Develop an archipelagic littoral defense doctrine emphasizing stealth torpedo attacks, submarine ambushes, and minefield barriers across our shallow straits."
  dei_decision_doktrin_dirgantara_taktis: "Doktrin Superioritas Udara Taktis Khatulistiwa"
  dei_decision_doktrin_dirgantara_taktis_desc: "Pioneer specialized tropical flight doctrines, optimizing close air support, interception readiness, and severe equatorial weather operations."
  dei_decision_riset_senjata_pindad: "Standardisasi Senjata Pindad & AI Bandung"
  dei_decision_riset_senjata_pindad_desc: "Standardize small arms and field artillery production at the Bandung arsenal facilities, accelerating domestic rifle development."
  dei_decision_riset_mekanisasi_braat: "Pengembangan Panser Cepat Braat Surabaya"
  dei_decision_riset_mekanisasi_braat_desc: "Commission the Braat Machinefabriek in Surabaya to produce specialized tropical light armored vehicles and armored cars for rapid archipelagic response."
  dei_decision_riset_dirgantara_iptn: "Inovasi Dirgantara IPTN & Lanud Andir"
  dei_decision_riset_dirgantara_iptn_desc: "Invest in domestic aviation manufacturing at Andir and Kalijati, accelerating airframe engineering and fighter aircraft production."
  dei_decision_riset_industri_pertamina: "Eksplorasi Minyak & Kilang BPM/Pertamina"
  dei_decision_riset_industri_pertamina_desc: "Expand strategic refining and fuel synthesis operations at Plaju and Balikpapan to fuel our expanding war effort."
  dei_decision_commission_armada_kri: "Modernisasi & Komisioning Armada Perang KRI"
  dei_decision_commission_armada_kri_desc: "Commission the core fighting vessels of the national fleet, establishing standardized destroyer, submarine, and fast torpedo boat designs at Surabaya dockyards."

  # Ideas & Spirits
  dei_idea_doktrin_gerilya_wilayah: "Doktrin Perang Wilayah & Sishanrata"
  dei_idea_doktrin_gerilya_wilayah_desc: "Mastery of archipelagic guerrilla doctrine provides entrenched defensive power and resilience against supply cutoffs in tropical terrain."
  dei_idea_doktrin_gerilya_laut: "Doktrin Gerilya Selat Dangkal"
  dei_idea_doktrin_gerilya_laut_desc: "Specialized shallow-water naval tactics maximize torpedo lethality and convoy interdiction across narrow archipelagic straits."
  dei_idea_doktrin_dirgantara_taktis: "Doktrin Dirgantara Khatulistiwa"
  dei_idea_doktrin_dirgantara_taktis_desc: "Rigorous training in equatorial weather conditions ensures reliable close air support and air intercept efficiency."
  dei_idea_standardisasi_pindad: "Standardisasi Persenjataan Pindad"
  dei_idea_standardisasi_pindad_desc: "Uniform firearm and munitions manufacturing increases the firepower and combat readiness of front-line infantry and artillery."
  dei_idea_mekanisasi_braat: "Mekanisasi Lapis Baja Braat"
  dei_idea_mekanisasi_braat_desc: "Light, nimble armored cars and tropical tanks offer rapid response mobility across the road and rail networks of the islands."
  dei_idea_kemandirian_iptn: "Kemandirian Dirgantara IPTN"
  dei_idea_kemandirian_iptn_desc: "Indigenous aviation engineering provides domestic air superiority capabilities tailored to our geography."
  dei_idea_eksplorasi_minyak: "Kilang Minyak Strategis Pertamina"
  dei_idea_eksplorasi_minyak_desc: "Intensive refining and resource management yield superior fuel production for naval and armored forces."

