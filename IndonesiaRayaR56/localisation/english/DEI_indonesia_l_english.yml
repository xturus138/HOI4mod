 dei_path_c.1.d: "Kekuatan-kekuatan kiri bersatu menjelang perebutan kekuasaan yang menentukan."
 dei_path_c.1.a: "Front Rakyat luas, gandeng semua kekuatan kiri"
 dei_path_c.1.b: "PKI sebagai poros tunggal, disiplin ketat"

 dei_path_c.2.t: "Land Reform Radikal"
 dei_path_c.2.d: "Tanah mulai didistribusikan ulang dari tuan tanah ke petani penggarap."
 dei_path_c.2.a: "Land reform radikal dan cepat"
 dei_path_c.2.b: "Land reform bertahap"

 dei_path_c.3.t: "Perebutan Pengaruh dengan Faksi Nasionalis"
 dei_path_c.3.d: "Berbeda dari sejarah aslinya, kali ini Front Rakyat berada di posisi lebih kuat."
 dei_path_c.3.a: "Tindak keras faksi nasionalis non-komunis"
 dei_path_c.3.b: "Rangkul faksi moderat ke koalisi"

 dei_path_c.4.t: "Tentara Rakyat Terbentuk"
 dei_path_c.4.d: "Kekuatan bersenjata baru yang setia pada ideologi rakyat kini berdiri."
 dei_path_c.4.a: "Lanjutkan"

 dei_path_c.5.t: "Hubungan dengan Moskow"
 dei_path_c.5.d: "Delegasi dikirim untuk menjalin hubungan erat dengan Uni Soviet."
 dei_path_c.5.a: "Lanjutkan"

 dei_path_c.6.t: "Hubungan dengan Beijing"
 dei_path_c.6.d: "Delegasi dikirim untuk menjalin hubungan erat dengan Republik Rakyat Tiongkok."
 dei_path_c.6.a: "Lanjutkan"

 dei_path_c.7.t: "Industrialisasi Sosialis"
 dei_path_c.7.d: "Menentukan arah pembangunan basis industri negara sosialis yang baru ini."
 dei_path_c.7.a: "Prioritaskan industri berat"
 dei_path_c.7.b: "Seimbangkan dengan kebutuhan rakyat"

 dei_path_c.8.t: "Ekspor Revolusi"
 dei_path_c.8.d: "Republik Rakyat Indonesia mulai mendukung gerakan-gerakan revolusioner di kawasan sekitarnya."
 dei_path_c.8.a: "Lanjutkan"

 #### EVENTS: Jalur D - Otoriter Militeristik ####
 dei_path_d.1.t: "Kudeta Militer"
 dei_path_d.1.d: "Faksi militer/nasionalis radikal bergerak mengambil alih kekuasaan."
 dei_path_d.1.a: "Kudeta cepat dan berdarah"
 dei_path_d.1.b: "Kudeta terencana, minim korban"

 dei_path_d.2.t: "Darurat Militer Diberlakukan"
 dei_path_d.2.d: "Status darurat memberi rezim baru wewenang penuh."
 dei_path_d.2.a: "Lanjutkan"

 dei_path_d.3.t: "Partai-Partai Politik Dibubarkan"
 dei_path_d.3.d: "Rezim baru memutuskan nasib partai-partai politik yang ada."
 dei_path_d.3.a: "Bubarkan semua partai tanpa kecuali"
 dei_path_d.3.b: "Sisakan satu partai negara tunggal"

 dei_path_d.4.t: "Industri Militer Dibangun"
 dei_path_d.4.d: "Ekonomi negara diarahkan untuk mendukung kekuatan militer."
 dei_path_d.4.a: "Lanjutkan"

 dei_path_d.5.t: "Kampanye Propaganda Nasionalis Radikal"
 dei_path_d.5.d: "Narasi kejayaan bangsa disebarkan lewat semua kanal media yang ada."
 dei_path_d.5.a: "Propaganda agresif lewat radio dan pers"
 dei_path_d.5.b: "Propaganda halus lewat pendidikan"

 dei_path_d.6.t: "Barisan Pemuda Militan Terbentuk"
 dei_path_d.6.d: "Pemuda diorganisir menjadi kekuatan paramiliter pendukung rezim."
 dei_path_d.6.a: "Lanjutkan"

 dei_path_d.7.t: "Klaim Wilayah yang \"Belum Kembali\""
 dei_path_d.7.d: "Rezim menegaskan klaim atas wilayah-wilayah di sekitar Nusantara."
 dei_path_d.7.a: "Klaim penuh, siap konfrontasi"
 dei_path_d.7.b: "Klaim bertahap, hindari perang dini"

 dei_path_d.8.t: "Ambisi Regional"
 dei_path_d.8.d: "Rezim kini menatap ke luar batas negeri, siap menegakkan klaimnya."
 dei_path_d.8.a: "Lanjutkan"

 #### EVENTS: Jalur E - Islamis ####
 dei_path_e.1.t: "Proklamasi Negara Islam Indonesia"
 dei_path_e.1.d: "Gerakan yang berbasis dari perjuangan Darul Islam kini mendekati kemenangan."
 dei_path_e.1.a: "Proklamasikan segera di daerah basis"
 dei_path_e.1.b: "Konsolidasi dulu, proklamasikan belakangan"

 dei_path_e.2.t: "Dewan Ulama Terbentuk"
 dei_path_e.2.d: "Badan penasihat keagamaan tertinggi negara baru ini mulai bekerja."
 dei_path_e.2.a: "Lanjutkan"

 dei_path_e.3.t: "Penerapan Syariat Islam"
 dei_path_e.3.d: "Menentukan sejauh mana syariat diterapkan sebagai landasan hukum negara."
 dei_path_e.3.a: "Penerapan penuh dan ketat"
 dei_path_e.3.b: "Penerapan bertahap, akomodasi keberagaman"

 dei_path_e.4.t: "Tentara Islam Indonesia Terbentuk"
 dei_path_e.4.d: "Kekuatan bersenjata resmi negara Islam yang baru diproklamasikan kini berdiri."
 dei_path_e.4.a: "Lanjutkan"

 dei_path_e.5.t: "Hubungan dengan Dunia Arab"
 dei_path_e.5.d: "Delegasi dikirim mencari pengakuan dan dukungan dari negara-negara Timur Tengah."
 dei_path_e.5.a: "Lanjutkan"

 dei_path_e.6.t: "Menghadapi Faksi Sekuler/Nasionalis"
 dei_path_e.6.d: "Kelompok nasionalis sekuler yang tersisa masih jadi tantangan bagi negara baru ini."
 dei_path_e.6.a: "Tumpas faksi sekuler"
 dei_path_e.6.b: "Rangkul faksi sekuler moderat ke koalisi"

 dei_path_e.7.t: "Reformasi Pendidikan Berbasis Agama"
 dei_path_e.7.d: "Sistem pendidikan nasional diarahkan sesuai nilai-nilai keagamaan."
 dei_path_e.7.a: "Lanjutkan"

 dei_path_e.8.t: "Persatuan Islam Nusantara"
 dei_path_e.8.d: "Komunitas-komunitas Muslim di kawasan Nusantara kini bersatu di bawah satu payung."
 dei_path_e.8.a: "Lanjutkan"

 #### EVENTS: Jalur F - Kebangkitan Majapahit (AHISTORIS) ####
 dei_path_f.1.t: "Kebangkitan Semangat Majapahit"
 dei_path_f.1.d: "[AHISTORIS] Sebuah gerakan revivalis mulai mengangkat warisan Majapahit sebagai simbol pemersatu Nusantara."
 dei_path_f.1.a: "Lanjutkan"

 dei_path_f.2.t: "Ekspedisi Pencarian Pusaka (Tahap 1)"
 dei_path_f.2.d: "[AHISTORIS] Sebuah ekspedisi dikirim mencari peninggalan yang bisa memperkuat legitimasi gerakan ini."
 dei_path_f.2.a: "Umumkan penemuan secara luas"
 dei_path_f.2.b: "Simpan diam-diam, gunakan sebagai legitimasi elit"

 dei_path_f.3.t: "Reaksi Tokoh Nasionalis Lain (Tahap 2)"
 dei_path_f.3.d: "[AHISTORIS] Tidak semua tokoh pergerakan menerima narasi kebangkitan Majapahit ini dengan mudah."
 dei_path_f.3.a: "Rangkul tokoh yang skeptis"
 dei_path_f.3.b: "Abaikan kritik, jalan terus"

 dei_path_f.4.t: "Reaksi Negara Tetangga (Tahap 3)"
 dei_path_f.4.d: "[AHISTORIS] Malaya dan Filipina mulai mengamati gerakan ini dengan curiga."
 dei_path_f.4.a: "Tegaskan ini murni simbolis, bukan klaim teritorial"
 dei_path_f.4.b: "Biarkan ambiguitas — buka jalan klaim di masa depan"

 dei_path_f.5.t: "Dewan Adat Nusantara Terbentuk"
 dei_path_f.5.d: "[AHISTORIS] Tokoh-tokoh adat dari berbagai penjuru kepulauan kini berhimpun."
 dei_path_f.5.a: "Lanjutkan"

 dei_path_f.6.t: "Angkatan Laut Agung Dibangun"
 dei_path_f.6.d: "[AHISTORIS] Tradisi maritim besar ala kejayaan lama mulai dihidupkan kembali."
 dei_path_f.6.a: "Lanjutkan"

 dei_path_f.7.t: "Klaim Wilayah \"Nusantara Raya\""
 dei_path_f.7.d: "[AHISTORIS] Klaim wilayah pengaruh diajukan, jauh melampaui batas Indonesia modern."
 dei_path_f.7.a: "Klaim luas mencakup seluruh bekas pengaruh Majapahit"
 dei_path_f.7.b: "Klaim terbatas, fokus konsolidasi dulu"

 dei_path_f.8.t: "Menyatukan Kerajaan-Kerajaan Nusantara"
 dei_path_f.8.d: "[AHISTORIS] Entitas-entitas kecil di sekitar kepulauan mulai dirangkul — atau ditundukkan."
 dei_path_f.8.a: "Persatuan lewat diplomasi dan pernikahan politik"
 dei_path_f.8.b: "Persatuan lewat show of force"

 dei_path_f.9.t: "Kekaisaran Nusantara Baru Diproklamasikan"
 dei_path_f.9.d: "[AHISTORIS] Puncak dari gerakan revivalis ini: sebuah kekaisaran baru yang mengklaim warisan Majapahit resmi berdiri."
 dei_path_f.9.a: "Lanjutkan"

